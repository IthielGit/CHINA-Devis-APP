name: Publier Hygo sur GitHub Pages

on:
  push:
    branches: [version-simple]
    paths: ['simple-app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (sans le dossier supabase/)
        run: |
          mkdir site
          cp -r simple-app/. site/
          rm -rf site/supabase

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
