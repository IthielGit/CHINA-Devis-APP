</style>
<style>
/* Variables du comparatif (reprises de la version mobile) */
.cmp,.offer-card,.offer-empty,.cmp-ctx{--m-surface:var(--surface);--m-surface2:var(--surface2);--m-ink:var(--ink);--m-muted:var(--muted);--m-accent:var(--accent)}

.cmp{display:grid;gap:12px;padding:16px 0 calc(120px + env(safe-area-inset-bottom,0px))}
.cmp-ctx{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:fit-content;max-width:100%;padding:8px 12px;border-radius:12px;background:var(--m-surface,var(--surface));box-shadow:var(--m-shadow,var(--shadow));font-size:14px;color:var(--m-muted,var(--muted))}
.cmp-ctx>span{min-width:0;overflow-wrap:anywhere}
.cmp-ctx .btn{flex:0 0 auto}
.cmp-ctx b{color:var(--m-ink,var(--ink))}
.cmp-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-ctrl .btn{min-height:44px;justify-content:center}
.offer-list{display:grid;gap:12px}
.offer-card{display:grid;gap:10px;background:var(--m-surface);border:1px solid var(--m-surface2);border-radius:18px;padding:16px;box-shadow:0 1px 2px #0000000d;min-width:0}
.oc-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:16px;font-weight:600;color:var(--m-ink)}
.oc-badge{font-size:12px;font-weight:600;color:var(--accent);background:#0b7f7720;border-radius:999px;padding:3px 9px}
.oc-price{display:grid;gap:2px}
.oc-fig{font-size:26px;font-weight:700;color:var(--m-ink);letter-spacing:-.3px;line-height:1.15}
.oc-lbl{font-size:14px;color:var(--m-muted)}
.oc-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--m-ink)}
.st{font-style:normal;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.st.warn{color:#b45309;background:#f59e0b24}
.oc-qual{font-size:14px;color:var(--m-muted)}
.oc-pick{width:100%;min-height:48px;justify-content:center}

.oc-body{display:grid;gap:12px;padding-top:8px;border-top:1px solid var(--m-surface2)}

.oc-notes{margin:0;padding-left:18px;font-size:14px;color:var(--m-muted);display:grid;gap:6px}
.offer-empty{background:var(--m-surface);border-radius:18px;padding:16px;font-size:14px;color:var(--m-muted)}
.cmp-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.cmp-check input{width:18px;height:18px;accent-color:var(--accent)}
/* Fenêtre Filtres du comparatif */
.more-list{display:grid;gap:10px;margin-top:12px}
.more-item{background:var(--surface2);color:var(--ink);justify-content:flex-start;padding:0 18px}
.m-close{margin-top:6px;color:var(--muted)}
</style>
<style id="suivi">

.op-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px;align-items:end;margin-top:8px}
.op-form .field{display:flex;flex-direction:column;gap:4px;border:0;padding:0}
.op-form .field-label{display:flex;align-items:center;gap:6px}
.op-form .field-info{display:inline-grid;place-items:center;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);font:600 12px/1 var(--f-body);cursor:help}
.op-form .row{grid-column:1/-1}

.quote-cols[inert]{opacity:.6}
.kv-note{font-size:12px;color:var(--muted);margin-top:6px}

.dash-chevron{color:var(--muted);font-size:20px;line-height:1}
.dash-stage-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}

.dash-empty{color:var(--muted);margin:4px 0}
.dash-hero .hint{margin:6px 0 12px}
.dash-recent{list-style:none;margin:0;padding:0}
.dash-steps>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.more-actions>summary{list-style:none;cursor:pointer;display:inline-flex}
.more-actions>summary::-webkit-details-marker{display:none}
.more-actions[open]>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quotebar .more-actions[open]{flex-basis:100%}
.hfilters>summary,.cal-filters-box>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600}
.hfilters[open]>summary,.cal-filters-box[open]>summary{margin-bottom:10px}
.hcards{display:none}
.hcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;background:var(--surface);cursor:pointer}

.hcard-meta{font-size:13px;color:var(--muted)}
.hcard-figs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
@media(max-width:760px){.htable{display:none}.hcards{display:grid;gap:10px}}
</style>

<title>Devis Transitaires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: left icon sidebar + soft canvas; white rounded cards; pastel KPI tiles (dashboard look). */
:root{
  --bg:#eceff6; --surface:#ffffff; --surface2:#f5f7fc; --line:#e2e6f0; --ink:#17203a; --muted:#69728f;
  --accent:#0b7f77; --accent-ink:#ffffff; --accent-soft:#dcf3f0;
  --in-bg:#f1f5ff; --in-fg:#1d4fc4; --in-line:#cfdcf7; --off-bg:#eef0f5; --off-fg:#8f98b0;
  --good:#17803d; --good-bg:#dff3e5; --warn:#a15c00; --warn-bg:#fdeed2; --bad:#b3261e; --bad-bg:#fbe3e0;
  --t1:#dcf3ef; --t2:#e2eaff; --t3:#fdf0cb; --t4:#fde3da; --shadow:0 1px 2px #1a244a0d,0 6px 20px #1a244a0d;
  --f-head:'IBM Plex Sans',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-num:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1221; --surface:#151c33; --surface2:#1a2340; --line:#273250; --ink:#e8ecf8; --muted:#98a2c3;
  --accent:#3fd0c3; --accent-ink:#04221f; --accent-soft:#143a42;
  --in-bg:#1a2745; --in-fg:#a9c2ff; --in-line:#2f4474; --off-bg:#1c2540; --off-fg:#6c7799;
  --good:#58d487; --good-bg:#16372436; --warn:#f0b254; --warn-bg:#3a2c12; --bad:#ff8a80; --bad-bg:#3d1b18;
  --t1:#143a3c; --t2:#1b2a55; --t3:#3a3216; --t4:#3d2622; --shadow:0 1px 2px #0006; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1221; --surface:#151c33; --surface2:#1a2340; --line:#273250; --ink:#e8ecf8; --muted:#98a2c3;
  --accent:#3fd0c3; --accent-ink:#04221f; --accent-soft:#143a42;
  --in-bg:#1a2745; --in-fg:#a9c2ff; --in-line:#2f4474; --off-bg:#1c2540; --off-fg:#6c7799;
  --good:#58d487; --good-bg:#16372436; --warn:#f0b254; --warn-bg:#3a2c12; --bad:#ff8a80; --bad-bg:#3d1b18;
  --t1:#143a3c; --t2:#1b2a55; --t3:#3a3216; --t4:#3d2622; --shadow:0 1px 2px #0006; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line);margin:0 -2px}
.bar-top{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:0 2px}
.bar h1{font-size:19px;letter-spacing:-.01em}
.bar .sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;padding:0 2px;scrollbar-width:none}
.tab{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* result strip */
.result{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 22px;margin-top:14px}
.result .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.8}
.result .big{font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1.2}
.result .small{font-size:12px;opacity:.9}
.quotebar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.quotebar .no{font-family:var(--f-num);font-weight:500;font-size:17px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card+.card{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.card+.card{margin-top:0}
.grid2>.card+.card{margin-top:0}
.calendar-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin:18px 0 10px}
.calendar-filters .sel{text-overflow:ellipsis;white-space:nowrap}
.calendar-filters label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;min-width:0}
.calendar-filters .inp,.calendar-filters .sel{width:100%;min-width:0}
@media(max-width:1100px){.calendar-filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.calendar-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar-filters .btn{grid-column:1/-1}}
.card h2{font-size:15px;margin-bottom:10px;letter-spacing:-.005em}
.card h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 12px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.field:first-of-type{border-top:0}
.field label{font-weight:500}
.field .help{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.field .note{grid-column:1/-1;font-size:12px}
@media(max-width:520px){.field{grid-template-columns:minmax(0,1fr)}}
.inp,.sel{width:100%;min-width:0;background:var(--in-bg);color:var(--in-fg);border:1px solid var(--in-line);border-radius:5px;padding:6px 8px;font-family:var(--f-num)}
.sel{font-family:var(--f-body)}
.inp.txt{font-family:var(--f-body)}
.inp:disabled,.sel:disabled,.inp.off{background:var(--off-bg);color:var(--off-fg);border-color:var(--line)}
textarea.inp{font-family:var(--f-body);resize:vertical}
/* Repères d'étapes */
.quote-steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.quote-steps .qs{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.quote-steps .qs-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.quote-steps .qs.is-done{color:var(--ink)}
.quote-steps .qs.is-done .qs-n{background:var(--accent);color:var(--accent-ink)}
.step-foot{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* Suffixe d'unité (¥ / pièce, Ar, cm…) : placé dans la même cellule que le champ, sans conteneur supplémentaire */
.field>label{grid-column:1;grid-row:1}
.field>.inp{grid-column:2;grid-row:1}
.field>.inp+span{grid-column:2;grid-row:1;justify-self:end;align-self:center;position:relative;z-index:1;margin-right:9px;pointer-events:none;color:var(--muted);font-size:12px;white-space:nowrap}
.field>.inp:has(+span){padding-right:44px}
@media(max-width:520px){.field>label{grid-row:1}.field>.inp,.field>.inp+span{grid-column:1;grid-row:2}}
/* tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface2)}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;border-top:2px solid var(--ink);background:var(--surface2)}
tr.sel td{background:var(--accent-soft)}
tr.dim td{color:var(--off-fg)}
td.best{background:var(--good-bg);color:var(--good);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:3px 0}
.kv>div:nth-child(odd){color:var(--muted)}
.kv>div:nth-child(even){text-align:right}
.hint{color:var(--muted);font-size:12px}
.warn{color:var(--warn)}.badtxt{color:var(--bad)}.goodtxt{color:var(--good)}
.tbl-edit input,.tbl-edit select{min-width:70px}
.tbl-edit td{padding:4px}
.tbl-edit .inp{padding:4px 6px}
details.cats{position:relative}
details.cats summary{cursor:pointer;background:var(--in-bg);color:var(--in-fg);border:1px solid var(--in-line);border-radius:5px;padding:4px 7px;min-width:130px;list-style:none;font-size:13px}
details.cats .menu{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;box-shadow:0 6px 20px #0003;min-width:200px}
details.cats .menu label{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:50;box-shadow:0 6px 24px #0004;max-width:90vw}

function quoteIsStale(q){
  const R=compute(q.inputs);
  return !R.sel||R.sel.label!==q.offer||Math.abs(N(R.costLot)-N(q.res.costLot))>0.01||Math.abs(N(R.pv)-N(q.res.pv))>0.01||(R.sel.I??null)!==(q.res.dateClient??null);
}
function setDestinationRule(q,destination){
  if(q.status!==STATUS.DRAFT)throw Error('La destination ne se modifie qu’avant la confirmation.');
  if(!DESTINATION_LIST.includes(destination))throw Error('Choisissez une destination dans la liste.');
  const next=copyData(q);
  next.destination=destination;
  return next;
}
function reviseQuote(q,now){
  if(q.status!==STATUS.CONFIRMED)throw Error('Une révision n’est possible qu’après confirmation et avant la commande en Chine.');
  const next=copyData(q);
  next.revisions.push(copyData({at:now,previousStatus:q.status,inputs:q.inputs,res:q.res,offer:q.offer,confirmation:q.confirmation}));
  next.statusHistory.push({from:q.status,to:STATUS.DRAFT,at:now,comment:'Révision du devis : à enregistrer puis confirmer à nouveau.'});
  next.status=STATUS.DRAFT;
  next.confirmation=null;next.estimates=null;
  next.logistics.arrivalPlanned=null;next.delivery.plannedAt=null;
  return next;
}
function correctLegacyStatus(q,status,comment,now){
  if(!q.needsStatusReview)throw Error('Ce devis n’a pas besoin de correction de statut.');
  if(!STATUS_LIST.includes(status))throw Error('Choisissez un statut dans la liste.');
  if(!comment?.trim())throw Error('Indiquez la raison de la correction.');
  const next=copyData(q);
  next.statusHistory.push({from:q.status,to:status,at:now,comment:'Correction manuelle : '+comment.trim(),manual:true});
  next.status=status;next.needsStatusReview=false;
  return next;
}
function plannedDateChange(q,field,date,reason,now){
  const spec=PLANNED_DATES[field];
  if(!spec)throw Error('Date inconnue.');
  if(field==='client'&&q.destination!==DESTINATION.CLIENT)throw Error('La livraison client ne concerne que les commandes client.');
  if(!spec.open.includes(q.status))throw Error(`${spec.label} ne peut plus être modifiée au statut « ${q.status} ».`);
  if(!date)throw Error('Renseignez la nouvelle date.');
  if(!reason?.trim())throw Error('Indiquez le motif du changement.');
  const oldValue=spec.get(q);
  if(oldValue===date)throw Error('La date saisie est déjà celle du dossier.');
  const next=copyData(q);
  spec.set(next,date);
  next.dateHistory.push({field,label:spec.label,oldValue,newValue:date,reason:reason.trim(),at:now});
  return next;
}
function saveClientInfo(q,input){
  if(q.destination!==DESTINATION.CLIENT)throw Error('Ce dossier n’est pas une commande client.');
  if(!BEFORE_DELIVERY.includes(q.status))throw Error('Les informations client ne peuvent plus être modifiées à ce statut.');
  const quantity=input.qtyToDeliver??null,fee=input.fee??null;
  if(quantity!==null&&(!Number.isInteger(quantity)||quantity<1))throw Error('La quantité à livrer doit être un entier supérieur à 0.');
  if(fee!==null&&!(isNum(fee)&&fee>=0))throw Error('Les frais de livraison doivent être positifs ou nuls.');
  const next=copyData(q);
  next.client={name:(input.name||'').trim(),contact:(input.contact||'').trim(),address:(input.address||'').trim(),comment:(input.comment||'').trim()};
  next.delivery.qtyToDeliver=quantity;
  next.delivery.fee=fee;
  return next;
}

/* Dépenses réelles : chaque ligne garde la devise, le taux utilisé et le montant converti en Ar. */
function buildExpense(input,now){
  const rate=input.currency==='Ar'?1:input.rate,amount=input.amount;
  if(!EXPENSE_CATEGORIES.includes(input.category))throw Error('Choisissez une catégorie de dépense.');
  if(!EXPENSE_CURRENCIES.includes(input.currency))throw Error('Choisissez une devise.');
  if(!isNum(amount)||amount<=0)throw Error('Saisissez un montant supérieur à 0.');
  if(!isNum(rate)||rate<=0)throw Error('Saisissez un taux de conversion supérieur à 0.');
  if(!input.paidAt)throw Error('Renseignez la date du paiement.');
  return{id:crypto.randomUUID(),category:input.category,amount,currency:input.currency,rate,amountAr:Math.round(amount*rate*100)/100,paidAt:input.paidAt,comment:(input.comment||'').trim(),proof:(input.proof||'').trim(),createdAt:now};
}
function addExpense(q,input,now){
  if(!SPENDING_STATUSES.includes(q.status))throw Error('Les dépenses ne peuvent pas être ajoutées à ce statut.');
  if(q.logistics.paidAt&&input.paidAt<q.logistics.paidAt)throw Error(`La date de la dépense ne peut pas précéder le paiement de la commande (${q.logistics.paidAt}).`);
  if(q.status===STATUS.DELIVERED&&q.delivery.actualAt&&input.paidAt>q.delivery.actualAt)throw Error(`La date de la dépense ne peut pas être postérieure à la livraison (${q.delivery.actualAt}).`);
  const next=copyData(q);
  next.expenses.push(buildExpense(input,now));
  return next;
}

/* Réceptions : quantités reçues, acceptées et endommagées sont saisies séparément.
   Le manquant est calculé par rapport à la quantité commandée. Plusieurs réceptions partielles sont permises. */
function receptionError(q,r){
  const count=x=>Number.isInteger(x)&&x>=0;
  if(!r.date)return 'Renseignez la date de réception.';
  if(!count(r.qtyReceived)||!count(r.qtyAccepted)||!count(r.qtyDamaged))return 'Les quantités doivent être des nombres entiers positifs ou nuls.';
  if(r.qtyShipped!==null&&!count(r.qtyShipped))return 'La quantité expédiée doit être un nombre entier positif ou nul.';
  if(r.qtyAccepted+r.qtyDamaged>r.qtyReceived)return 'Les quantités acceptées et endommagées ne peuvent pas dépasser les quantités reçues.';
  const totals=receptionTotals(q);
  if(totals.received+r.qtyReceived>totals.ordered)return `Plus d’unités reçues que commandées : ${totals.ordered} commandées, ${totals.received} déjà reçues.`;
  return null;
}
function addReception(q,input,now){
  if(q.status!==STATUS.RECEPTION)throw Error('Les réceptions se saisissent pendant le contrôle de réception.');
  const reception={id:crypto.randomUUID(),date:input.date,qtyShipped:input.qtyShipped??null,qtyReceived:input.qtyReceived,qtyAccepted:input.qtyAccepted,qtyDamaged:input.qtyDamaged??0,comment:(input.comment||'').trim(),createdAt:now};
  const error=receptionError(q,reception);
  if(error)throw Error(error);
  const next=copyData(q);
  next.receptions.push(reception);
  return next;
}
function addIncident(q,input,now){
  if(!SPENDING_STATUSES.includes(q.status))throw Error('Un incident se déclare une fois la commande passée.');
  if(!input.date)throw Error('Renseignez la date de l’incident.');
  if(!INCIDENT_TYPES.includes(input.type))throw Error('Choisissez le type d’incident.');
  if(!input.description?.trim())throw Error('Décrivez l’incident.');
  const next=copyData(q);
  next.incidents.push({id:crypto.randomUUID(),createdAt:now,date:input.date,type:input.type,description:input.description.trim(),resolution:'En cours',refundAr:null,closed:false});
  return next;
}
function resolveIncident(q,incidentId,input,now){
  const incident=q.incidents.find(i=>i.id===incidentId);
  if(!incident)throw Error('Incident introuvable.');
  if(incident.closed)throw Error('Cet incident est déjà clos.');
  if(!INCIDENT_RESOLUTIONS.includes(input.resolution))throw Error('Choisissez la solution obtenue.');
  const refund=input.refundAr??null;
  if(refund!==null&&!(isNum(refund)&&refund>=0))throw Error('Le remboursement doit être positif ou nul.');
  const next=copyData(q);
  Object.assign(next.incidents.find(i=>i.id===incidentId),{resolution:input.resolution,refundAr:refund,closed:true,closedAt:now});
  return next;
}

/* Entrée de stock créée une seule fois, à la transition vers « Stock boutique ». Le coût unitaire
   est réel si des dépenses sont enregistrées, sinon celui du devis. */
function buildStockEntry(q,now){
  const accepted=acceptedTotal(q),real=realCostAr(q),unitCost=real>0?real/accepted:q.res.costP;
  return{id:crypto.randomUUID(),quoteNo:q.no,product:q.inputs.name,enteredAt:now,qtyAccepted:accepted,qtyExcluded:receptionTotals(q).damaged,unitCost:isNum(unitCost)?Math.round(unitCost*100)/100:null,costBasis:real>0?'réel':'estimé'};
}

/* Une action sur un devis est refusée si elle effacerait un suivi ou contournerait le verrouillage. */
function quoteActionBlock(q,action){
  if(q.paymentGroupId&&(action==='edit'||action==='del'))return 'Dissociez d’abord le paiement groupé pour modifier ou supprimer ce devis.';
  if(action==='edit'&&q.status!==STATUS.DRAFT)return 'Ce devis est confirmé : ouvrez son suivi et utilisez « Réviser » pour le modifier.';
  if(action==='del'&&!canDeleteQuote(q))return 'Ce dossier a déjà un suivi (confirmation, commande, réception ou dépense) : annulez-le au lieu de le supprimer.';
  return null;
}

/* Message bref (disparaît seul) ; une erreur reste affichée jusqu’à ce que l’utilisateur la ferme. */
function toast(msg,{sticky=false}={}){
  if(sticky)document.querySelectorAll('.toast.is-error').forEach(old=>old.remove());
  const t=document.createElement('div');t.className='toast'+(sticky?' is-error':'');t.setAttribute('role',sticky?'alert':'status');t.textContent=msg;
  if(sticky){const close=document.createElement('button');close.type='button';close.className='toast-close';close.textContent='OK';close.onclick=()=>t.remove();t.append(' ',close)}
  document.body.appendChild(t);
  if(!sticky)setTimeout(()=>t.remove(),3500);
}

/* ---------- calculation engine (port of the workbook formulas) ---------- */
const yuanRate=p=>p.cnyUsd?Math.round(p.usd*(1+p.marge)/p.cnyUsd*100)/100:null;
const catList=t=>String(t||'').split(';').map(s=>s.trim()).filter(Boolean);
const offerLabel=t=>t.tr+' | '+t.mode+(t.svc?' '+t.svc:'')+' | '+(t.cats||'');
const tariffTransportLabel=t=>t.svc||t.mode;
function savedOfferLabel(value){return String(value||'').replace(/^(.+ \| )Maritime .+ \| (.+)$/i,'$1Maritime | $2')}
function savedTransportService(quote){
  return /^Maritime(?:\s+.+)?$/i.test(quote.res?.svc||'')?'Maritime':quote.res?.svc||'';
}
function dimsOf(d){if(typeof d.dims!=='string')return[N(d.L),N(d.W),N(d.H)];const a=(d.dims.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));return a.length===3?a:[0,0,0]}
function compute(d,p=S.params,tarifs=S.tarifs,cal=S.cal){
  const qty=Math.max(1,N(d.qty));
  const dm=dimsOf(d), reel=N(d.wt), prod=dm[0]*dm[1]*dm[2];
  const vol_w=prod?prod/p.div:null, vol=prod?prod/1e6:null;
  const arr=d.pay?dayNum(d.pay)+N(d.delai)+N(d.heure)/24:null;
  const yr=yuanRate(p), achat=N(d.price)*N(yr);
  const transactionTotal=d.paymentAllocation?d.paymentAllocation.shareAr:(isNum(yr)?N(d.trans)*yr:null);
  const transactionPerPiece=isNum(transactionTotal)?transactionTotal/qty:null;
  const offers=tarifs.filter(t=>t.tr).map((t,i)=>{
    const o={i,t,label:offerLabel(t)};
    o.compat=catList(t.cats).includes(d.cat);
    const eff=t.base||d.base;
    let v=null;
    if(t.unit==='m³'){ if(vol) v=Math.ceil(r6(vol/p.arrV))*p.arrV }
    else if(t.unit==='pièce') v=1;
    else if(eff==='Poids réel'){ if(reel) v=Math.ceil(r6(reel/p.arrP))*p.arrP }
    else if(eff==='Poids volumétrique'){ if(vol_w) v=Math.ceil(r6(vol_w/p.arrP))*p.arrP }
    else { const m=Math.max(reel,N(vol_w)); if(m) v=Math.ceil(r6(m/p.arrP))*p.arrP }
    if(v!==null&&isNum(t.min)) v=Math.max(v,t.min);
    o.qty=v;
    o.tarif=!isNum(t.tarif)?null:(t.unit==='m³'&&isNum(t.palier)&&v>t.palier?t.tarif2:t.tarif);
    o.E=(o.tarif!==null&&isNum(o.tarif)&&v!==null)?v*o.tarif*(t.cur==='USD'?p.usd:1):null;
    // départ
    o.F=null;o.excludedDates=[];o.keptCloseDate=null;o.calendarNotice='';
    if(arr!==null){
      const lim=(c)=>Math.ceil(Math.round((arr+N(c)-N(t.h)/24)*1e9)/1e9);
      o.arr=arr;
      const service=quoteService(t);
      const dates=cal.filter(c=>c.tr===t.tr&&c.mode===t.mode&&serviceKey(c.svc)===serviceKey(service)&&c.date).map(c=>dayNum(c.date));
      if(!dates.length)o.calendarNotice=`Aucune date publiée pour ${t.tr} · ${service||t.mode}.`;
      if(dates.length){
        const arrivalDay=Math.floor(arr),cutoff=lim(t.c1);
        o.excludedDates=dates.filter(x=>x>=arrivalDay&&x<cutoff).map(date=>({date,cutoff:date-N(t.c1)+N(t.h)/24}));
        const ok=p.calendarClosePolicy==='keep'?dates.filter(x=>x>=arrivalDay):dates.filter(x=>x>=cutoff);
        o.F=ok.length?Math.min(...ok):null;
        if(o.F!==null)o.calendarEntry=cal.find(c=>c.tr===t.tr&&c.mode===t.mode&&serviceKey(c.svc)===serviceKey(service)&&dayNum(c.date)===o.F)||null;
        if(p.calendarClosePolicy==='keep')o.keptCloseDate=o.excludedDates.find(x=>x.date===o.F)||null;
      }
      else if(t.d1){
        const nx=(day,c)=>{const b=lim(c);return b+mod(JOURS.indexOf(day)+1-wdIso(b),7)};
        const a=nx(t.d1,t.c1);
        o.F=t.d2?Math.min(a,nx(t.d2,t.c2)):a;
      }
    }
    o.G=(o.F!==null&&isNum(t.dmax))?o.F+t.dmax:null;
    o.Hh=o.G!==null?o.G+p.dispo+((p.dimanche==='Non'&&wdIso(o.G+p.dispo)===7)?1:0):null;
    o.I=o.Hh!==null?o.Hh+(t.mode==='Maritime'?p.mMar:p.mAvion):null;
    o.earliest=(o.F!==null&&isNum(t.dmin))?o.F+t.dmin:null;
    o.J=o.E!==null?achat+o.E+(N(d.livCh)+N(d.exclus)+N(d.livFin))/qty+N(transactionPerPiece):null;
    const ub=t.unit==='kg'&&!t.base;
    o.fl={base:ub?1:0,dims:(t.unit==='m³'||(t.unit==='kg'&&eff!=='Poids réel'))?1:0,wt:(t.unit==='kg'&&eff!=='Poids volumétrique')?1:0};
    return o;
  });
  const comp=offers.filter(o=>o.compat);
  comp.forEach(o=>{
    o.rP=isNum(o.J)?comp.filter(x=>isNum(x.J)&&x.J<o.J).length+1:null;
    o.rD=isNum(o.I)?comp.filter(x=>isNum(x.I)&&x.I<o.I).length+1:null;
  });
  const bestP0=comp.find(o=>o.rP===1)||null, bestD0=comp.find(o=>o.rD===1)||null, mode=d.mode||'manuel';
  // Date souhaitée : « Moins cher » choisit l’offre la moins chère qui arrive avant cette date, sinon l’offre la moins chère.
  const arrivesWanted=o=>isNum(o.I)&&o.I<dayNum(d.wantBy)+1;
  const cheapestWanted=d.wantBy?comp.filter(o=>isNum(o.J)&&arrivesWanted(o)).sort((a,b)=>a.J-b.J)[0]||null:null;
  const wantByMissed=!!d.wantBy&&mode==='prix'&&!cheapestWanted;
  const sel=mode==='prix'?(cheapestWanted||bestP0):mode==='rapide'?(bestD0||bestP0):(comp.find(o=>o.label===d.offer)||null);
  // field usage: 2 = used, 1 = used by other offers only, 0 = unused
  const use=k=>{ if(!comp.length)return 2; if(sel)return sel.fl[k]?2:(comp.some(o=>o.fl[k])?1:0); return comp.some(o=>o.fl[k])?2:0 };
  const R={qty,reel:reel||null,vol_w,vol,arr,yr,achat:isNum(yr)&&d.price?achat:null,offers,comp,sel,use:{base:use('base'),dims:use('dims'),wt:use('wt')}};
  const transP=sel&&isNum(sel.E)?sel.E:null;
  R.transP=transP;
  R.wantByMissed=wantByMissed;
  R.livChP=N(d.livCh)?d.livCh/qty:null; R.exclP=N(d.exclus)?d.exclus/qty:null; R.livFinP=N(d.livFin)?d.livFin/qty:null;
  R.transacLot=transactionTotal;
  R.transacP=transactionPerPiece;
  if(transP!==null){
    R.costP=N(R.achat)+transP+N(R.livChP)+N(R.exclP)+N(R.livFinP)+N(R.transacP);
    R.costLot=N(R.achat)*qty+transP*qty+N(d.livCh)+N(d.exclus)+N(R.transacLot)+N(d.livFin);
  } else {R.costP=null;R.costLot=null}
  R.pvAdvised=isNum(R.costP)?Math.ceil(R.costP*(1+N(d.marge))/100)*100:null;
  R.pv=isNum(d.pvRetenu)?d.pvRetenu:R.pvAdvised;
  R.margeP=isNum(R.pv)&&isNum(R.costP)?R.pv-R.costP:null;
  R.revenueLot=isNum(R.pv)?R.pv*qty:null;
  R.margeLot=isNum(R.revenueLot)&&isNum(R.costLot)?R.revenueLot-R.costLot:null;
  R.margeRate=isNum(R.margeP)&&R.costP?R.margeP/R.costP:null;
  R.markRate=isNum(R.margeP)&&R.pv?R.margeP/R.pv:null;
  R.bestP=comp.find(o=>o.rP===1)||null; R.bestD=comp.find(o=>o.rD===1)||null;
  return R;
}
function calendarFeedback(o){
  const hour=x=>String(Math.round((x-Math.floor(x))*24)).padStart(2,'0')+' h';
  const notes=[];
  if(o.calendarNotice)notes.push(o.calendarNotice);
  const arrival=`${fd(Math.floor(o.arr))} à ${hour(o.arr)}`;
  const describe=(item,action)=>`Départ du ${fd(item.date)} ${action} : arrivée estimée au dépôt ${arrival}, après l’heure limite du ${fd(Math.floor(item.cutoff))} à ${hour(item.cutoff)}.`;
  if(o.keptCloseDate)notes.push(describe(o.keptCloseDate,'conservé malgré l’heure limite'));
  else for(const item of o.excludedDates||[])notes.push(describe(item,'écarté'));
  return notes;
}
function snapshot(d,R,p=S.params){
  const s=R.sel;
  return{costP:R.costP,costLot:R.costLot,pv:R.pv,margeP:R.margeP,dateClient:s?s.I:null,tr:s?s.t.tr:'',svc:s?tariffTransportLabel(s.t):'',
    qty:R.qty,achat:R.achat,transP:R.transP,yr:R.yr,usd:p.usd,depart:s?s.F:null,arrMax:s?s.G:null,dispo:s?s.Hh:null,
    transacLot:R.transacLot,transacP:R.transacP,revenueLot:R.revenueLot,margeLot:R.margeLot,note:s?s.t.note:''};
}
function allocatePayment(records,feeCny,rate){
  if(records.length<2||!isNum(feeCny)||feeCny<0||!isNum(rate)||rate<=0)throw Error('Sélectionnez au moins deux devis et saisissez des frais et un taux valides.');
  if(records.some(q=>q.paymentGroupId||!Number.isInteger(q.inputs.qty)||q.inputs.qty<=0||!isNum(q.res.costLot)||!isNum(q.res.costP)||!isNum(q.inputs.marge)||q.inputs.marge<0))throw Error('Un devis est déjà groupé ou contient des valeurs invalides.');
  const quantity=records.reduce((n,q)=>n+q.inputs.qty,0),cents=Math.round(feeCny*rate*100);
  if(!Number.isSafeInteger(quantity)||!Number.isSafeInteger(cents))throw Error('Quantité ou montant trop élevé.');
  const shares=records.map(q=>({no:q.no,qty:q.inputs.qty,cents:Math.floor(cents*q.inputs.qty/quantity),fraction:(cents*q.inputs.qty/quantity)%1}));
  let remaining=cents-shares.reduce((n,s)=>n+s.cents,0);
  [...shares].sort((a,b)=>b.fraction-a.fraction).slice(0,remaining).forEach(s=>s.cents++);
  return {quantity,totalAr:cents/100,shares:shares.map(s=>({...s,shareAr:s.cents/100}))};
}
function applyPaymentShare(q,share,group){
  const next=JSON.parse(JSON.stringify(q)),r=next.res,qty=next.inputs.qty,delta=share.shareAr-N(r.transacLot);
  r.costLot+=delta;r.costP=r.costLot/qty;r.transacLot=share.shareAr;r.transacP=share.shareAr/qty;
  r.pv=isNum(next.inputs.pvRetenu)?next.inputs.pvRetenu:Math.ceil(r.costP*(1+next.inputs.marge)/100)*100;
  r.margeP=r.pv-r.costP;r.revenueLot=r.pv*qty;r.margeLot=r.revenueLot-r.costLot;
  if(['costP','costLot','pv','margeP','revenueLot','margeLot'].some(k=>!isNum(r[k])))throw Error('Les montants de ce devis dépassent les limites de calcul.');
  next.paymentGroupId=group.id;next.inputs.paymentAllocation={groupId:group.id,name:group.name,shareAr:share.shareAr,totalAr:group.totalAr,quantity:group.quantity,feeCny:group.feeCny,rate:group.rate};
  next.modified=group.created;return next;

function checkQuote(d,R,p=S.params){
  const errors=[],warnings=[];
  const today=dayNum(new Intl.DateTimeFormat('sv-SE',{timeZone:'Indian/Antananarivo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));
  if(!d.name?.trim())errors.push('Renseignez le nom du produit.');
  if(!Number.isInteger(d.qty)||d.qty<1)errors.push('La quantité doit être un nombre entier supérieur à 0.');
  if(!isNum(d.price)||d.price<0)errors.push('Renseignez un prix d’achat valide (0 est accepté).');
  for(const key of ['usd','cnyUsd','div','arrP','arrV'])if(!isNum(p[key])||p[key]<=0)errors.push('Paramètres invalides : les taux de change, le diviseur et les arrondis doivent être supérieurs à 0.');
  if(!isNum(p.marge)||p.marge<0||!isNum(yuanRate(p))||yuanRate(p)<=0)errors.push('Le taux yuan ou la marge de sécurité du change est invalide.');
  for(const key of ['livCh','exclus','livFin','trans','marge'])if(!isNum(d[key])||d[key]<0)errors.push('Les frais et la marge doivent être des nombres positifs ou nuls.');
  if(!R.sel)errors.push('Choisissez une offre compatible.');
  if(R.use.dims===2&&(!/^\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*$/i.test(d.dims||'')||dimsOf(d).some(n=>n<=0)))errors.push('Renseignez trois dimensions positives : longueur × largeur × hauteur.');
  if(R.use.wt===2&&(!isNum(d.wt)||d.wt<=0))errors.push('Renseignez un poids emballé supérieur à 0.');
  if(!isNum(R.costP)||!isNum(R.costLot)||!isNum(R.pv)||R.pv<0)errors.push('Le coût ou le prix de vente ne peut pas être calculé. Vérifiez les tarifs.');
  if(R.sel&&(!isNum(R.sel.F)||!isNum(R.sel.I)))warnings.push('Départ ou livraison non déterminé : le calendrier peut être incomplet ou dépassé.');
  else if(R.sel&&R.sel.F<today)warnings.push('Le départ calculé est déjà passé. Vérifiez la date de paiement et le calendrier.');
  if(isNum(R.margeLot)&&R.margeLot<0)warnings.push('Vente à perte : le prix de vente est inférieur au prix de revient.');
  return {errors:[...new Set(errors)],warnings};
}

/* Mémoire des produits : chaque devis enregistré met à jour la fiche de son produit (nom, prix, dimensions, poids, catégorie). */
const productKey=name=>String(name||'').trim().toLowerCase();
function rememberProduct(products,d){
  const key=productKey(d.name);if(!key)return products;
  const entry={key,name:d.name.trim(),cat:d.cat,price:d.price,dims:d.dims,wt:d.wt,qty:d.qty,destination:d.destination||'',marge:d.marge,updated:nowIso()};
  return [...products.filter(p=>p.key!==key),entry];
}
/* Quand le nom saisi correspond à un produit connu, on reprend ses valeurs ; l’utilisateur peut toujours les changer. */
function applyKnownProduct(){
  const known=S.products.find(p=>p.key===productKey(S.draft.name));
  if(!known)return;
  const destination=known.destination||S.draft.destination||'';
  Object.assign(S.draft,{cat:known.cat,catManual:true,price:known.price,dims:known.dims,wt:known.wt,qty:known.qty||1,destination,marge:known.marge??S.draft.marge});
  $('#f_marge')&&($('#f_marge').value=String(S.draft.marge));
  $('#f_cat').value=known.cat;$('#f_price').value=known.price==null?'':String(known.price);$('#f_dims').value=known.dims||'';$('#f_wt').value=known.wt==null?'':String(known.wt);
  $('#f_qty').value=String(S.draft.qty);$('#f_destination').value=destination;
}
function saveQuote(silent,acknowledged=false){
  const d=S.draft,R=compute(d);
  if(S.quotes.find(q=>q.no===d.no)?.paymentGroupId){toast('Ce devis appartient à un paiement groupé. Dissociez le paiement dans l’historique avant de le modifier.');return}
  const checks=checkQuote(d,R);
  if(checks.errors.length){if(silent!==true)reviewDialog('À corriger avant l’enregistrement',checks.errors);return}
  if(checks.warnings.length&&!acknowledged){if(silent!==true)reviewDialog('Vérifiez ces points',checks.warnings,'Enregistrer malgré ces alertes',()=>saveQuote(false,true));return}
  if(!d.name.trim()){if(silent!==true){toast('Donnez un nom au produit avant d’enregistrer.');$('#f_name').focus()}return}
  if(!R.sel){if(silent!==true)toast('Aucune offre disponible : vérifiez la catégorie et les tarifs.');return}
  const now=nowIso(),i=S.quotes.findIndex(q=>q.no===d.no),existing=i>=0?S.quotes[i]:null;
  if(existing&&existing.status!==STATUS.DRAFT){toast('Ce devis est confirmé : ouvrez son suivi et utilisez « Réviser » pour le modifier.');return}
  // Les champs de suivi (statut, destination) ne font pas partie des entrées du devis.
  const {status,destination,...inputFields}=copyData(d);
  const inputs={...inputFields,mode:'manuel',offer:R.sel.label};
  const base=existing??normalizeQuoteWorkflow({no:d.no,created:now,status:STATUS.DRAFT,statusHistory:[{from:null,to:STATUS.DRAFT,at:now,comment:'Création du devis'}]});
  const rec={...base,modified:now,inputs,res:snapshot(d,R),offer:R.sel.label,destination:d.destination||''};
  const quotes=[...S.quotes];if(i>=0)quotes[i]=rec;else quotes.push(rec);
  if(!commitState({...S,quotes,editing:d.no,products:rememberProduct(S.products,d)}))return;
  dirty=false;drawTabs();refresh();if(silent!==true)toast('Devis '+d.no+' enregistré dans l’historique.');
}

/* Sauvegardes automatiques : une copie par jour d’activité, sept jours au maximum, dans ce navigateur (ce n’est pas un fichier). */
const SNAP_KEY='devis-daily-snapshots';
function readSnapshots(){try{return JSON.parse(localStorage.getItem(SNAP_KEY)||'[]')}catch{return[]}}
function takeDailySnapshot(){
  if(!S.quotes.length)return;
  const day=todayTana(),list=readSnapshots();
  if(list[0]?.day===day)return;
  try{localStorage.setItem(SNAP_KEY,JSON.stringify([{day,at:nowIso(),data:JSON.stringify(S)},...list].slice(0,7)))}catch{}
}
function snapshotCard(){
  const list=readSnapshots();
  return `<section class="card"><h2>Sauvegardes automatiques</h2><p class="hint" style="margin-top:0">Une copie est gardée chaque jour où vous travaillez, sept jours au maximum. Elle reste dans ce navigateur : exportez aussi un fichier pour avoir une vraie copie.</p>${list.length?`<ul class="dash-recent">${list.map((s,i)=>`<li><button type="button" class="dash-row" data-restore="${i}"><span class="dash-row-label">${esc(fdIso(s.day))} <span class="hint">· enregistrée à ${s.at?fdtm(s.at):'—'}</span></span><span class="dash-chevron" aria-hidden="true">Restaurer</span></button></li>`).join('')}</ul>`:'<p class="kv-note">Aucune sauvegarde pour l’instant.</p>'}</section>`;
}
function restoreSnapshot(index){
  const snap=readSnapshots()[Number(index)];if(!snap)return;
  reviewDialog('Restaurer cette sauvegarde ?',[`Données du ${fdIso(snap.day)}. Les dossiers et paramètres actuels seront remplacés.`],'Restaurer',()=>{
    let next;try{next=normAll(JSON.parse(snap.data))}catch{toast('Sauvegarde illisible.');return}
    if(commitState(next))location.reload();
  });
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-restore]');if(b)restoreSnapshot(b.dataset.restore)});

function groupPaymentDialog(){
  // Seuls les brouillons peuvent être groupés : regrouper un devis confirmé changerait ses coûts figés.
  const available=S.quotes.filter(q=>!q.paymentGroupId&&q.status===STATUS.DRAFT);
  if(available.length<2){reviewDialog('Deux devis nécessaires',['Enregistrez au moins deux devis en brouillon non groupés, puis sélectionnez ceux payés ensemble.']);return}
  const dialog=document.createElement('dialog');dialog.className='calendar-dialog tariff-dialog';dialog.setAttribute('aria-labelledby','paymentTitle');
  dialog.innerHTML=`<form><h2 id="paymentTitle">Un paiement pour plusieurs produits</h2><p class="hint">Sélectionnez les devis payés ensemble. Leurs anciens frais de transaction seront remplacés par leur part des frais communs. Les prix automatiques et les marges seront recalculés ; les prix manuels seront conservés.</p><div class="field"><label for="paymentName">Référence du paiement</label><input class="inp txt" id="paymentName" required placeholder="Ex. Commande fournisseur du 15 octobre"></div><div class="field"><label for="paymentFee">Frais payés une seule fois (¥)</label><input class="inp" id="paymentFee" type="number" min="0" step="any" value="2" required></div><div class="field"><label for="paymentRate">Taux commun (Ar / ¥)</label><input class="inp" id="paymentRate" type="number" min="0.01" step="any" value="${yuanRate(S.params)??''}" required><div class="help">Ce taux s’applique seulement aux frais communs. Les achats et transports conservent les valeurs enregistrées.</div></div><fieldset style="border:0;padding:12px 0"><legend>Produits de ce paiement</legend>${available.map(q=>`<label class="row" style="padding:8px 0"><input type="checkbox" name="member" value="${esc(q.no)}">${esc(q.no)} · ${esc(q.inputs.name)} · ${q.inputs.qty} pièce(s)</label>`).join('')}</fieldset><div id="paymentPreview" class="hint" aria-live="polite"></div><p id="paymentError" role="alert" class="badtxt"></p><div class="row"><button type="button" class="btn" id="paymentCancel">Annuler</button><button class="btn pri" type="submit">Confirmer le paiement groupé</button></div></form>`;
  const read=()=>{const ids=[...dialog.querySelectorAll('[name=member]:checked')].map(el=>el.value);const records=S.quotes.filter(q=>ids.includes(q.no));const fee=$('#paymentFee',dialog).value,rate=$('#paymentRate',dialog).value;const allocation=allocatePayment(records,fee===''?NaN:Number(fee),rate===''?NaN:Number(rate));return {records,allocation,feeCny:Number(fee),rate:Number(rate)}};
  const preview=()=>{try{const {records,allocation}=read();$('#paymentPreview',dialog).innerHTML=`<b>${ar(allocation.totalAr)} au total pour ${allocation.quantity} pièces</b><ul>${allocation.shares.map(s=>`<li>${esc(s.no)} : ${dec(s.shareAr,2)} Ar pour ${s.qty} pièce(s), soit ${dec(s.shareAr/s.qty,4)} Ar / pièce.</li>`).join('')}</ul><p>La confirmation met à jour ces ${records.length} devis. Dissocier le paiement restaurera leurs valeurs précédentes.</p>`}catch(e){$('#paymentPreview',dialog).textContent=e.message}};
  document.body.appendChild(dialog);dialog.showModal();dialog.addEventListener('close',()=>{dialog.remove();$('#groupPayment')?.focus()});$('#paymentCancel',dialog).onclick=()=>dialog.close();dialog.addEventListener('input',preview);preview();
  $('form',dialog).onsubmit=e=>{e.preventDefault();try{const {records,allocation,feeCny,rate}=read(),name=$('#paymentName',dialog).value.trim();if(!name)throw Error('Renseignez une référence.');const group={id:crypto.randomUUID(),name,feeCny,rate,...allocation,created:new Date().toISOString(),before:JSON.parse(JSON.stringify(records))};const updates=records.map(q=>applyPaymentShare(q,allocation.shares.find(s=>s.no===q.no),group));const next=JSON.parse(JSON.stringify(S));next.quotes=next.quotes.map(q=>updates.find(u=>u.no===q.no)||q);next.paymentGroups.push(group);if(updates.some(q=>q.no===next.draft.no))next.draft=JSON.parse(JSON.stringify(updates.find(q=>q.no===next.draft.no).inputs));const losses=updates.filter(q=>q.res.margeLot<0);const finish=()=>{if(commitState(next)){dialog.close();drawHisto();toast('Frais répartis et paiement enregistré.')}};if(losses.length)reviewDialog('Vente à perte après répartition',losses.map(q=>q.no+' : marge de '+ar(q.res.margeLot)),'Confirmer malgré la perte',finish);else finish()}catch(error){$('#paymentError',dialog).textContent=error.message}};
}
function ungroupPayment(id){
  const group=S.paymentGroups.find(g=>g.id===id);if(!group)return;
  if(S.quotes.some(q=>group.before.some(old=>old.no===q.no)&&q.status!==STATUS.DRAFT)){toast('Impossible : un devis de ce paiement est déjà confirmé. Son coût est figé.');return}
  reviewDialog('Dissocier ce paiement ?', ['Les devis retrouveront exactement leurs frais, prix et marges d’avant le regroupement. Les autres devis restent inchangés.'],'Dissocier le paiement',()=>{const next=JSON.parse(JSON.stringify(S));
    // Seuls les montants sont restaurés : le statut, les dates et le suivi du dossier restent intacts.
    next.quotes=next.quotes.map(q=>{const old=group.before.find(b=>b.no===q.no);if(!old)return q;const restored={...q,inputs:old.inputs,res:old.res,modified:old.modified};delete restored.paymentGroupId;return restored});next.paymentGroups=next.paymentGroups.filter(g=>g.id!==id);if(next.draft.paymentAllocation?.groupId===id)next.draft=JSON.parse(JSON.stringify(group.before.find(q=>q.no===next.draft.no).inputs));if(commitState(next)){drawHisto();toast('Paiement dissocié.')}});
}

  $('#paymentList').querySelectorAll('[data-ungroup]').forEach(b=>b.onclick=()=>ungroupPayment(b.dataset.ungroup));

  `<div class="htable"><table><thead><tr><th>N°</th><th>Statut</th><th>Créé</th><th>Modifié</th><th>Produit</th><th class="r">Qté</th><th>Destination</th><th>Transitaire</th><th>Offre</th><th class="r">Coût estimé</th><th class="r">Coût réel</th><th class="r">Coût / pièce</th><th class="r">Vente / pièce</th><th>Arrivée prévue</th><th>Date client</th><th></th></tr></thead><tbody>`+
  L.map(q=>`<tr><td class="num">${esc(q.no)}${q.paymentGroupId?'<div class="pill">Paiement groupé · verrouillé</div>':''}</td><td>${statusPill(q)}</td><td>${fdt(q.created)}</td><td>${fdt(q.modified)}</td><td>${esc(q.inputs.name)}</td><td class="r num">${q.res.qty}</td><td>${esc(q.destination||'—')}</td><td>${esc(q.res.tr)}</td><td>${esc(savedTransportService(q))}</td>
   <td class="r num">${ar(q.res.costLot)}</td><td class="r num">${q.expenses.length?ar(realCostAr(q)):'—'}</td><td class="r num">${ar(q.res.costP)}</td><td class="r num">${ar(q.res.pv)}</td><td class="num">${arrivalCell(q)}</td><td class="num">${isNum(q.res.dateClient)?fd(q.res.dateClient):''}</td>
   <td><div class="row" style="flex-wrap:nowrap" data-no="${esc(q.no)}"><button class="btn sm" data-a="view">Voir</button><button class="btn sm" data-a="edit">Modifier</button><button class="btn sm" data-a="dup">Dupliquer</button><button class="btn sm dng" data-a="del">Supprimer</button></div></td></tr>`).join('')+'</tbody></table></div><div class="hcards">'+L.map(historyCard).join('')+'</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const no=b.parentElement.dataset.no;const q=S.quotes.find(x=>x.no===no);if(!q)return;
  const a=b.dataset.a;
  if(a==='view')return showQuote(q);
  const block=quoteActionBlock(q,a);if(block)return toast(block);
  if(a==='edit')openQuoteForEdit(q);
  else if(a==='dup')duplicateQuote(q);
  else if(a==='del'){
    if(b.dataset.sure){S.quotes=S.quotes.filter(x=>x.no!==no);persist();drawTabs();drawHisto();toast('Devis '+no+' supprimé.')}
    else{b.dataset.sure=1;b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Supprimer'}},3500)}
  }
});
/* ---------- SUIVI : fiche du dossier, actions selon le statut, tableau de bord ---------- */
const STATUS_TONE={[STATUS.DRAFT]:'',[STATUS.CONFIRMED]:'info',[STATUS.ORDERED]:'info',[STATUS.SHIPPED]:'info',[STATUS.ARRIVED]:'warn',[STATUS.READY]:'warn',[STATUS.COLLECTED]:'warn',[STATUS.RECEPTION]:'warn',[STATUS.STOCK]:'good',[STATUS.TO_DELIVER]:'warn',[STATUS.DELIVERED]:'good',[STATUS.CANCELLED]:'bad'};
const COMMENT_FIELD={name:'comment',label:'Commentaire',type:'text',optional:true};
/* Champs demandés pour chaque transition. La validation réelle est dans transitionError. */
const TRANSITION_FORMS={
  [STATUS.CONFIRMED]:{label:'Confirmer le devis',fields:[]},
  [STATUS.ORDERED]:{label:'Enregistrer la commande en Chine',fields:[
    {name:'platform',label:'Plateforme d’achat (ex. Pinduoduo)',type:'text'},
    {name:'supplier',label:'Fournisseur',type:'text'},
    {name:'reference',label:'Référence de commande',type:'text',optional:true},
    {name:'orderedAt',label:'Date de commande et de paiement',type:'date'},
    {name:'paidAmountCny',label:'Montant total payé (¥)',type:'number',tooltip:'Montant total réellement payé pour l’ensemble des pièces commandées.'},
    {name:'qtyOrdered',label:'Quantité commandée (pièces)',type:'number',min:1,step:1,tooltip:'Nombre total de pièces achetées dans cette commande.'},
    {name:'parcelRef',label:'Référence du colis (si connue)',type:'text',optional:true}]},
  [STATUS.SHIPPED]:{label:'Marquer expédié depuis la Chine',fields:[{name:'date',label:'Date d’expédition',type:'date'}]},
  [STATUS.ARRIVED]:{label:'Marquer arrivé à Madagascar',fields:[{name:'date',label:'Date d’arrivée réelle',type:'date'}]},
  [STATUS.READY]:{label:'Marquer disponible au retrait',fields:[{name:'date',label:'Date de mise à disposition',type:'date'}]},
  [STATUS.COLLECTED]:{label:'Marquer récupéré chez le transitaire',fields:[{name:'date',label:'Date de retrait',type:'date'}]},
  [STATUS.RECEPTION]:{label:'Démarrer le contrôle de réception',fields:[]},
  [STATUS.STOCK]:{label:'Clôturer la réception : ranger en stock boutique',fields:[]},
  [STATUS.TO_DELIVER]:{label:'Clôturer la réception : à livrer au client',fields:[]},
  [STATUS.DELIVERED]:{label:'Confirmer la livraison au client',fields:[{name:'date',label:'Date réelle de livraison',type:'date'},{name:'confirmed',label:'Le client confirme avoir reçu la commande',type:'checkbox'}]},
  [STATUS.CANCELLED]:{label:'Annuler le dossier',fields:[{name:'reason',label:'Motif d’annulation',type:'text'}]}
};

const fdIso=iso=>iso?fd(dayNum(iso)):'—';
const fdtm=iso=>iso?new Date(iso).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
const arOr=x=>isNum(x)?ar(x):'—';
const numOrNull=v=>v===undefined||v===null||v===''?null:Number(v);
const kvRow=(label,value)=>`<div>${label}</div><div class="num">${value}</div>`;
const optionsOf=list=>list.map(value=>({value,label:value}));

function statusPill(q){return `<span class="pill ${STATUS_TONE[q.status]}">${esc(q.status)}</span>`+(q.needsStatusReview?' <span class="pill warn">À vérifier</span>':'')}
function arrivalCell(q){
  if(!q.logistics.arrivalPlanned)return '—';
  const shift=arrivalShiftDays(q);
  return `${fdIso(q.logistics.arrivalPlanned)}${shift>0?` <span class="pill warn">+${shift} j</span>`:''}${isOverdue(q,todayTana())?' <span class="pill bad">En retard</span>':''}`;
}

function fieldHtml(f,prefix){
  const id=`${prefix}_${f.name}`;
  if(f.type==='hidden')return `<input type="hidden" name="${f.name}" value="${esc(f.value)}">`;
  if(f.type==='checkbox')return `<label class="cmp-check"><input type="checkbox" name="${f.name}"> ${esc(f.label)}</label>`;
  const labelText=`${esc(f.label)}${f.optional?' <span class="hint">(optionnel)</span>':''}`,required=f.optional?'':' required';
  const label=f.tooltip?`<div class="field-label"><label for="${id}">${labelText}</label><button type="button" class="field-info" title="${esc(f.tooltip)}" aria-label="Information : ${esc(f.tooltip)}">i</button></div>`:`<label for="${id}">${labelText}</label>`;
  if(f.type==='select')return `<div class="field">${label}<select class="sel" id="${id}" name="${f.name}"${required}>${f.options.map(o=>`<option value="${esc(o.value)}"${o.value===f.value?' selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  const numeric=f.type==='number'?` min="${f.min??0}" step="${f.step??'any'}" inputmode="decimal"`:'';
  const dateBounds=f.type==='date'?`${f.min?` min="${esc(f.min)}"`:''}${f.max?` max="${esc(f.max)}"`:''}`:'';
  const value=f.value==null?'':` value="${esc(f.value)}"`;
  return `<div class="field">${label}<input class="inp${f.type==='text'?' txt':''}" id="${id}" name="${f.name}" type="${f.type}"${required}${numeric}${dateBounds}${value}></div>`;
}
/* Formulaire d’une action : la soumission passe par onOperationSubmit. */
function opForm(op,no,fields,{prefix,label,target,className='btn pri'}){
  const hidden=target?`<input type="hidden" name="target" value="${esc(target)}">`:'';
  return `<form class="op-form" data-op="${op}" data-no="${esc(no)}">${hidden}${fields.map(f=>fieldHtml(f,prefix)).join('')}<div class="row"><button class="${className}" type="submit">${esc(label)}</button></div></form>`;
}

function ficheNotices(q){
  const notes=[];
  if(q.inputs.paymentAllocation){const group=q.inputs.paymentAllocation;notes.push(`Paiement groupé « ${group.name} » : frais uniques ${dec(group.feeCny)} ¥, soit ${ar(group.totalAr)} pour ${group.quantity} pièces. Part de ce devis : ${dec(group.shareAr,2)} Ar.`)}
  if(q.needsStatusReview)notes.push('Devis enregistré avant le suivi : son statut a été attribué automatiquement. Vérifiez-le et corrigez-le ci-dessous si besoin.');
  for(const r of q.revisions)notes.push(`Version précédente du ${fdtm(r.at)} : coût de la commande ${arOr(r.res.costLot)}, prix de vente ${arOr(r.res.pv)}.`);
  if(q.cancellation)notes.push(`Dossier annulé le ${fdtm(q.cancellation.at)} : ${q.cancellation.reason}`);
  return notes.map(note=>`<p class="manual-note" role="status">${esc(note)}</p>`).join('');
}

/* Valeurs proposées dans les formulaires : la dernière commande connue, la date du jour, la quantité du devis.
   Rien n’est enregistré tant que l’utilisateur ne valide pas le formulaire. */
function lastOrder(){
  const known=S.quotes.filter(q=>q.order?.orderedAt).sort((a,b)=>b.order.orderedAt.localeCompare(a.order.orderedAt));
  return known[0]?.order||null;
}
/* Catégorie de la dernière dépense saisie (sinon la plus courante : achat fournisseur). */
function lastExpenseCategory(){
  const all=S.quotes.flatMap(q=>q.expenses||[]).sort((a,b)=>String(b.paidAt||'').localeCompare(String(a.paidAt||'')));
  return all[0]?.category||'Achat fournisseur';
}
function prefilledValues(q,target){
  const today=todayTana(),last=lastOrder();
  if(target===STATUS.ORDERED)return{platform:last?.platform||'',supplier:last?.supplier||'',orderedAt:today,paidAmountCny:isNum(q.inputs.price)?Math.round(q.inputs.price*q.inputs.qty*100)/100:'',qtyOrdered:q.inputs.qty||1};
  return{date:today};
}
const withPrefill=(fields,values)=>fields.map(f=>f.value===undefined&&values[f.name]!==undefined?{...f,value:values[f.name]}:f);

/* Actions proposées selon le statut courant : une seule étape suivante, l’annulation et la révision à part. */
function actionPanel(q){
  const no=esc(q.no),targets=nextStatuses(q),parts=[];
  if(targets.includes(STATUS.CONFIRMED))parts.push(`<button type="button" class="btn pri" data-op="confirm" data-no="${no}">Confirmer le devis</button>`);
  const forward=targets.find(t=>t!==STATUS.CONFIRMED&&t!==STATUS.CANCELLED);
  if(forward){const form=TRANSITION_FORMS[forward];parts.push(opForm('transition',q.no,[...withPrefill(form.fields,prefilledValues(q,forward)),COMMENT_FIELD],{prefix:'tr',label:form.label,target:forward}))}
  if(q.status===STATUS.CONFIRMED)parts.push(`<div class="row" style="margin-top:10px"><button type="button" class="btn" data-op="revise" data-no="${no}">Réviser le devis</button><span class="kv-note">Le devis redevient modifiable ; la version confirmée reste dans l’historique.</span></div>`);
  if(targets.includes(STATUS.CANCELLED))parts.push(`<details class="cancel-box" style="margin-top:12px"><summary>Annuler ce dossier</summary>${opForm('transition',q.no,TRANSITION_FORMS[STATUS.CANCELLED].fields,{prefix:'cancel',label:'Confirmer l’annulation',target:STATUS.CANCELLED,className:'btn dng'})}<p class="kv-note">L’annulation ne supprime rien : le dossier, son historique et les dépenses déjà payées restent consultables.</p></details>`);
  if(q.needsStatusReview)parts.push(`<div style="margin-top:12px"><b>Corriger le statut</b>${opForm('correct',q.no,[{name:'status',label:'Statut réel de ce dossier',type:'select',value:q.status,options:optionsOf(STATUS_LIST)},{name:'comment',label:'Raison de la correction',type:'text'}],{prefix:'corr',label:'Corriger le statut'})}</div>`);
  if(!parts.length)parts.push('<p class="hint">Dossier clos : aucune action possible.</p>');
  return `<section class="card fiche-section"><h3>Action suivante</h3>${parts.join('')}</section>`;
}

function plannedDateForm(q){
  const options=Object.entries(PLANNED_DATES).filter(([key,spec])=>spec.open.includes(q.status)&&(key!=='client'||q.destination===DESTINATION.CLIENT)).map(([key,spec])=>({value:key,label:spec.label}));
  if(!options.length)return '';
  return `<h4 style="margin-top:12px">Modifier une date estimée</h4>${opForm('changeDate',q.no,[{name:'field',label:'Date estimée',type:'select',options},{name:'date',label:'Nouvelle date',type:'date'},{name:'reason',label:'Motif (retard, changement de vol, de bateau…)',type:'text'}],{prefix:'pd',label:'Enregistrer le changement'})}`;
}
/* Dates estimées (devis) et dates réelles (transitaire) sont présentées séparément. */
function datesSection(q){
  const L=q.logistics,E=q.estimates??{},D=q.delivery,shift=arrivalShiftDays(q);
  const rows=[
    ['Paiement au vendeur (réel)',fdIso(L.paidAt)],
    ['Expédition depuis la Chine (réel)',fdIso(L.shippedAt)],
    ['Arrivée prévue initiale (estimation du devis)',fdIso(E.arrivalInitial)],
    ['Dernière arrivée prévue (estimation)',`${fdIso(L.arrivalPlanned)}${shift>0?` <span class="pill warn">+${shift} j vs devis</span>`:''}${isOverdue(q,todayTana())?' <span class="pill bad">En retard</span>':''}`],
    ['Arrivée réelle à Madagascar',fdIso(L.arrivedAt)],
    ['Disponible au retrait (réel)',fdIso(L.availableAt)],
    ['Retrait chez le transitaire (réel)',fdIso(L.withdrawnAt)]
  ];
  if(q.destination===DESTINATION.CLIENT)rows.push(['Livraison client prévue (estimation)',fdIso(D.plannedAt)],['Livraison client réelle',fdIso(D.actualAt)]);
  const history=q.dateHistory.slice().reverse().map(h=>`<li>${fdtm(h.at)} · ${esc(h.label)} : ${fdIso(h.oldValue)} → <b>${fdIso(h.newValue)}</b> · motif : ${esc(h.reason)}</li>`).join('');
  return `<section class="card fiche-section"><h3>Dates logistiques</h3><div class="kv">${rows.map(([label,value])=>kvRow(label,value)).join('')}</div>
    ${history?`<h4 style="margin-top:12px">Changements de date estimée</h4><ul class="timeline">${history}</ul>`:'<p class="kv-note">Aucun changement de date estimée.</p>'}
    ${plannedDateForm(q)}</section>`;
}

function clientSection(q){
  if(q.destination!==DESTINATION.CLIENT)return '';
  const C=q.client,D=q.delivery;
  if(!BEFORE_DELIVERY.includes(q.status))return `<section class="card fiche-section"><h3>Client</h3><div class="kv">${kvRow('Nom',esc(C.name))}${kvRow('Contact',esc(C.contact))}${kvRow('Adresse',esc(C.address))}${kvRow('Quantité livrée',D.qtyToDeliver??'—')}${kvRow('Livraison confirmée',D.confirmed?'Oui':'Non')}</div></section>`;
  return `<section class="card fiche-section"><h3>Client et livraison</h3>${opForm('saveClient',q.no,[
    {name:'name',label:'Nom du client',type:'text',value:C.name,optional:true},
    {name:'contact',label:'Téléphone ou moyen de contact',type:'text',value:C.contact,optional:true},
    {name:'address',label:'Adresse de livraison',type:'text',value:C.address,optional:true},
    {name:'qtyToDeliver',label:'Quantité à livrer',type:'number',min:1,step:1,value:D.qtyToDeliver,optional:true},
    {name:'fee',label:'Frais de livraison facturés (Ar)',type:'number',value:D.fee,optional:true},
    {name:'comment',label:'Commentaire',type:'text',value:C.comment,optional:true}],{prefix:'client',label:'Enregistrer les informations client'})}
    <p class="kv-note">Les informations client sont vérifiées à la clôture de la réception, avant la livraison.</p></section>`;
}

/* Frais communs : règle d’allocation affichée dans la fiche (part du dossier au prorata des pièces). */
function expenseSection(q){
  if(!SPENDING_STATUSES.includes(q.status)&&!q.expenses.length)return '';
  const estimated=q.res.costLot,real=realCostAr(q),accepted=acceptedTotal(q),hasExpenses=q.expenses.length>0;
  const gap=hasExpenses&&isNum(estimated)?real-estimated:null;
  const rows=q.expenses.map(e=>`<tr><td>${fdIso(e.paidAt)}</td><td>${esc(e.category)}</td><td class="r num">${dec(e.amount,2)} ${esc(e.currency)}</td><td class="r num">${dec(e.rate,4)}</td><td class="r num">${ar(e.amountAr)}</td><td>${esc([e.comment,e.proof?'justificatif : '+e.proof:''].filter(Boolean).join(' · '))||'—'}</td></tr>`).join('');
  const form=SPENDING_STATUSES.includes(q.status)?opForm('addExpense',q.no,[
    {name:'category',label:'Catégorie',type:'select',options:optionsOf(EXPENSE_CATEGORIES),value:lastExpenseCategory()},
    {name:'amount',label:'Montant payé (dans la devise choisie)',type:'number'},
    {name:'currency',label:'Devise',type:'select',options:optionsOf(EXPENSE_CURRENCIES),value:'CNY'},
    {name:'rate',label:'Taux de conversion (Ar pour 1 unité)',type:'number',min:0,step:'any',value:yuanRate(S.params)},
    {name:'paidAt',label:'Date du paiement',type:'date',value:todayTana(),min:q.logistics.paidAt,max:q.status===STATUS.DELIVERED?q.delivery.actualAt:undefined},
    {name:'proof',label:'Référence du justificatif',type:'text',optional:true},
    COMMENT_FIELD],{prefix:'exp',label:'Ajouter la dépense'}):'';
  return `<section class="card fiche-section"><h3>Dépenses réelles</h3>
    ${hasExpenses?`<div class="tw"><table><thead><tr><th>Date</th><th>Catégorie</th><th class="r">Montant</th><th class="r">Taux</th><th class="r">En Ar</th><th>Commentaire · justificatif</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="kv-note">Aucune dépense réelle enregistrée : les coûts affichés restent des estimations.</p>'}
    <div class="kv" style="margin-top:10px">
      ${kvRow('Coût estimé de la commande (devis)',arOr(estimated))}
      ${kvRow('Coût réel enregistré',hasExpenses?ar(real):'—')}
      ${kvRow('Différence avec l’estimation',gap!==null?`${ar(gap)}${estimated?` (${dec(gap/estimated*100,1)} %)`:''}`:'—')}
      ${kvRow('Coût réel par unité acceptée',hasExpenses&&accepted>0?ar(real/accepted):'—')}
      ${kvRow('Marge estimée (devis)',arOr(q.res.margeLot))}
      ${kvRow('Marge recalculée (prix × unités acceptées − coûts réels)',hasExpenses&&accepted>0&&isNum(q.res.pv)?ar(q.res.pv*accepted-real):'—')}
    </div>
    <p class="kv-note">Saisissez le montant réellement payé pour cette dépense, dans la devise choisie (CNY, USD ou Ar), après le paiement et dès l’étape « Commande passée » ; vous pouvez ajouter les dépenses aux étapes suivantes jusqu’à la livraison. Le taux indique le nombre d’ariary pour 1 unité de devise (ex. 1 CNY = 93,5 Ar ; pour Ar, le taux est 1). Le total payé au fournisseur est demandé à « Enregistrer la commande en Chine » ; pour qu’il entre aussi dans le coût réel, enregistrez-le ici une seule fois sous « Achat fournisseur ». Pour les frais communs, saisissez uniquement la part attribuable à ce devis, au prorata des pièces commandées. Le taux est prérempli en CNY : adaptez-le pour un paiement en USD.</p>
    ${form}</section>`;
}

function receptionSection(q){
  const relevant=[STATUS.COLLECTED,STATUS.RECEPTION,STATUS.STOCK,STATUS.TO_DELIVER,STATUS.DELIVERED].includes(q.status)||q.receptions.length>0;
  if(!relevant)return '';
  const T=receptionTotals(q),stock=S.stock.find(e=>e.quoteNo===q.no);
  const rows=q.receptions.map(r=>`<tr><td>${fdIso(r.date)}</td><td class="r num">${r.qtyShipped??'—'}</td><td class="r num">${r.qtyReceived}</td><td class="r num">${r.qtyAccepted}</td><td class="r num">${r.qtyDamaged}</td><td>${esc(r.comment||'—')}</td></tr>`).join('');
  const incidents=q.incidents.map(i=>`<li>${fdIso(i.date)} · <b>${esc(i.type)}</b> : ${esc(i.description)} · ${i.closed?`clos : ${esc(i.resolution)}${i.refundAr?` (${ar(i.refundAr)})`:''}`:`<span class="pill warn">en cours</span>${opForm('resolveIncident',q.no,[{name:'incidentId',type:'hidden',value:i.id},{name:'resolution',label:'Solution obtenue',type:'select',options:optionsOf(INCIDENT_RESOLUTIONS)},{name:'refundAr',label:'Montant remboursé (Ar)',type:'number',optional:true}],{prefix:`inc${i.id}`,label:'Clore l’incident',className:'btn sm'})}`}</li>`).join('');
  // Valeurs proposées : il reste (commandé − déjà reçu), supposé complet et sans casse. Les écarts se corrigent dans le formulaire.
  const expected=Math.max(0,T.ordered-T.received);
  const receptionForm=q.status===STATUS.RECEPTION?`<div class="rec-check" role="group" aria-label="Contrôle rapide" data-expected="${expected}">
      <label class="cmp-check"><input type="checkbox" data-rec-check="counted"> Pièces comptées : quantité complète reçue</label>
      <label class="cmp-check"><input type="checkbox" data-rec-check="intact"> Aucune pièce cassée ou non conforme</label></div>`+opForm('addReception',q.no,[
    {name:'date',label:'Date de réception',type:'date',value:todayTana()},
    {name:'qtyShipped',label:'Quantité expédiée (si connue)',type:'number',min:0,step:1,optional:true,value:T.ordered||undefined},
    {name:'qtyReceived',label:'Quantité reçue',type:'number',min:0,step:1,value:expected},
    {name:'qtyAccepted',label:'Quantité acceptée',type:'number',min:0,step:1,value:expected},
    {name:'qtyDamaged',label:'Endommagée ou non conforme',type:'number',min:0,step:1,optional:true,value:0},
    COMMENT_FIELD],{prefix:'rec',label:'Enregistrer la réception'}):'';
  const incidentForm=SPENDING_STATUSES.includes(q.status)?opForm('addIncident',q.no,[
    {name:'date',label:'Date de l’incident',type:'date'},
    {name:'type',label:'Type',type:'select',options:optionsOf(INCIDENT_TYPES)},
    {name:'description',label:'Description',type:'text'}],{prefix:'inc',label:'Déclarer l’incident',className:'btn'}):'';
  return `<section class="card fiche-section"><h3>Réception et incidents</h3>
    <div class="kv">${kvRow('Commandé',T.ordered)}${kvRow('Reçu',T.received)}${kvRow('Accepté',T.accepted)}${kvRow('Endommagé ou non conforme (exclu du stock)',T.damaged)}${kvRow('Manquant (commandé − reçu)',T.missing)}</div>
    ${q.receptions.length?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>Date</th><th class="r">Expédié</th><th class="r">Reçu</th><th class="r">Accepté</th><th class="r">Endommagé</th><th>Observations</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
    ${stock?`<p class="kv-note"><b>Stock boutique :</b> ${stock.qtyAccepted} ${stock.qtyAccepted>1?'unités acceptées, entrées':'unité acceptée, entrée'} le ${fdtm(stock.enteredAt)}, coût unitaire ${arOr(stock.unitCost)} (${esc(stock.costBasis)}).</p>`:''}
    ${receptionForm}
    <h4 style="margin-top:12px">Réclamations, remboursements, remplacements</h4>
    ${q.incidents.length?`<ul class="timeline">${incidents}</ul>`:'<p class="kv-note">Aucun incident déclaré.</p>'}
    ${incidentForm}</section>`;
}

function timelineSection(q){
  const items=q.statusHistory.slice().reverse().map(h=>`<li>${fdtm(h.at)} · ${h.from?`${esc(h.from)} → `:''}<b>${esc(h.to)}</b>${h.comment?` · ${esc(h.comment)}`:''}${h.manual?' <span class="pill warn">manuel</span>':''}</li>`).join('');
  return `<section class="card fiche-section"><h3>Chronologie du dossier</h3><ul class="timeline">${items||'<li>Aucun événement.</li>'}</ul></section>`;
}

    <div class="row fiche-head">${statusPill(q)}<span class="hint">${esc(q.destination||'Destination non choisie')}${q.res.tr?' · '+esc(q.res.tr):''}</span></div>
    ${q.status===STATUS.DRAFT?destinationSection(q):''}
    ${ficheNotices(q)}

/* ---- Opérations : une seule porte d’entrée, qui applique les règles du référentiel ---- */
const transitionPayload=(target,raw)=>{
  const comment=raw.comment||'';
  if(target===STATUS.ORDERED)return{comment,platform:raw.platform,supplier:raw.supplier,reference:raw.reference,orderedAt:raw.orderedAt,paidAmountCny:numOrNull(raw.paidAmountCny),qtyOrdered:numOrNull(raw.qtyOrdered),parcelRef:raw.parcelRef};
  if(target===STATUS.CANCELLED)return{reason:raw.reason||''};
  if(target===STATUS.DELIVERED)return{comment,date:raw.date,confirmed:raw.confirmed==='on'};
  return{comment,date:raw.date};
};
const clientPayload=raw=>({name:raw.name,contact:raw.contact,address:raw.address,comment:raw.comment,qtyToDeliver:numOrNull(raw.qtyToDeliver),fee:numOrNull(raw.fee)});
const expensePayload=raw=>({category:raw.category,amount:numOrNull(raw.amount),currency:raw.currency,rate:numOrNull(raw.rate),paidAt:raw.paidAt,proof:raw.proof,comment:raw.comment});
const receptionPayload=raw=>({date:raw.date,qtyShipped:numOrNull(raw.qtyShipped),qtyReceived:numOrNull(raw.qtyReceived),qtyAccepted:numOrNull(raw.qtyAccepted),qtyDamaged:numOrNull(raw.qtyDamaged),comment:raw.comment});
const incidentPayload=raw=>({date:raw.date,type:raw.type,description:raw.description});
const resolutionPayload=raw=>({resolution:raw.resolution,refundAr:numOrNull(raw.refundAr)});

/* Enregistre un nouvel état du devis ; les autres devis et les tables partagées ne sont pas modifiés. */
function commitWorkflowChange(no,change,extraFor=()=>({})){
  const current=S.quotes.find(q=>q.no===no);
  if(!current)throw Error('Devis introuvable.');
  const next=change(current);
  const state={...S,quotes:S.quotes.map(q=>q.no===no?next:q),...extraFor(next)};
  if(state.draft.no===no)state.draft={...state.draft,status:next.status,destination:next.destination};
  return commitState(state);
}
/* Transition validée par le référentiel. Une entrée de stock est créée dans le même enregistrement d’état,
   et seulement si aucune n’existe : un double clic ne crée donc jamais de second mouvement. */
function advanceQuote(no,target,payload,extraContext={}){
  const context={hasStockEntry:S.stock.some(e=>e.quoteNo===no),...extraContext};
  return commitWorkflowChange(no,q=>{
    const error=transitionError(q,target,payload,context);
    if(error)throw Error(error);
    return applyTransition(q,target,payload,nowIso());
  },next=>target===STATUS.STOCK?{stock:[...S.stock,buildStockEntry(next,nowIso())]}:{});
}
function confirmQuote(no,acknowledged=false){
  const record=S.quotes.find(q=>q.no===no);
  if(!record)throw Error('Enregistrez le devis avant de le confirmer.');
  if(S.draft.no===no&&dirty)throw Error('Enregistrez d’abord les modifications du devis.');
  const R=compute(record.inputs),checks=checkQuote(record.inputs,R);
  if(checks.errors.length){reviewDialog('À corriger avant la confirmation',checks.errors);return false}
  if(checks.warnings.length&&!acknowledged){
    reviewDialog('Vérifiez ces points',checks.warnings,'Confirmer malgré ces alertes',()=>runWorkflowAction(no,()=>confirmQuote(no,true),'Devis confirmé : le suivi peut commencer.'));
    return false;
  }
  // Copie figée des hypothèses tarifaires utilisées pour l’audit (le devis n’est pas recalculé ensuite).
  const confirmation={at:nowIso(),params:copyData(S.params),tariff:copyData(R.sel.t),offer:R.sel.label};
  return advanceQuote(no,STATUS.CONFIRMED,{confirmation},{stale:quoteIsStale(record)});
}
function confirmFromDevis(){const no=S.draft.no;runWorkflowAction(no,()=>confirmQuote(no),'Devis confirmé : le suivi peut commencer.')}

/* Exécute une action puis rafraîchit les vues. Retourne false si elle a été refusée ou annulée. */
function runWorkflowAction(no,action,message){
  try{if(action()===false)return false}
  catch(error){toast(error.message,{sticky:true});return false}
  if(message)toast(message);
  refreshQuoteViews(no);
  return true;
}
function refreshQuoteViews(no){
  drawTabs();
  if(S.tab==='devis')refresh();
  if(S.tab==='histo')drawHisto();
  if(S.tab==='dash')viewDash($('#view'));
  if($('#ov')?.dataset.no===no){const record=S.quotes.find(q=>q.no===no);record?showQuote(record):closeQuote()}
}
function runOperation(op,no,raw={}){
  const now=nowIso();
  switch(op){
    case 'confirm':return runWorkflowAction(no,()=>confirmQuote(no),'Devis confirmé : le suivi peut commencer.');
    case 'transition':return runWorkflowAction(no,()=>advanceQuote(no,raw.target,transitionPayload(raw.target,raw)),'Statut mis à jour : '+raw.target+'.');
    case 'revise':{
      const ok=runWorkflowAction(no,()=>{commitWorkflowChange(no,q=>reviseQuote(q,now),next=>({draft:draftFromQuote(next)}));dirty=false},'Devis rouvert : modifiez-le puis enregistrez-le.');
      if(ok){closeQuote();go('devis')}
      return ok;
    }
    case 'setDestination':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>setDestinationRule(q,raw.destination)),'Destination enregistrée.');
    case 'correct':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>correctLegacyStatus(q,raw.status,raw.comment,now)),'Statut corrigé et tracé dans la chronologie.');
    case 'changeDate':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>plannedDateChange(q,raw.field,raw.date,raw.reason,now)),'Date estimée mise à jour.');
    case 'saveClient':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>saveClientInfo(q,clientPayload(raw))),'Informations client enregistrées.');
    case 'addExpense':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>addExpense(q,expensePayload(raw),now)),'Dépense enregistrée.');
    case 'addReception':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>addReception(q,receptionPayload(raw),now)),'Réception enregistrée.');
    case 'addIncident':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>addIncident(q,incidentPayload(raw),now)),'Incident déclaré.');
    case 'resolveIncident':return runWorkflowAction(no,()=>commitWorkflowChange(no,q=>resolveIncident(q,raw.incidentId,resolutionPayload(raw),now)),'Incident clos.');
  }
}
function onOperationClick(e){
  const button=e.target.closest('button[data-op]');
  if(!button||button.closest('form'))return;
  runOperation(button.dataset.op,button.dataset.no);
}
function onOperationSubmit(e){
  const form=e.target.closest('form[data-op]');
  if(!form)return;
  e.preventDefault();
  runOperation(form.dataset.op,form.dataset.no,Object.fromEntries(new FormData(form)));
}

/* Un devis est ouvert pour modification à partir de ses entrées ; le suivi est rattaché au brouillon. */
function draftFromQuote(q){const d={...copyData(q.inputs),status:q.status,destination:q.destination||''};normalizeLegacyOffer(d);return d}
function openQuoteForEdit(q){S.draft=draftFromQuote(q);S.editing=q.no;dirty=false;go('devis')}
function duplicateQuote(q){
  S.draft={...draftFromQuote(q),no:nextNo(),status:STATUS.DRAFT};
  delete S.draft.paymentAllocation;
  S.editing=null;dirty=true;go('devis');
  toast('Copie prête : '+S.draft.no+' (nouveau paiement, frais individuels).');
}

/* Ouvre un nouveau devis vierge (même comportement pour le bouton du bureau et celui de l’accueil). */
function startNewQuote(){
  // Destination reprise du dernier dossier : la plupart des envois vont au même endroit.
  const last=[...S.quotes].sort((a,b)=>b.modified.localeCompare(a.modified))[0];
  // Paramètres de transport et frais de commande repris du devis précédent : l’utilisateur peut les modifier.
  const fresh=blankDraft(nextNo());
  const kept=['marge','delai','heure','base','livCh','exclus','livFin','trans'].map(k=>[k,S.draft[k]??fresh[k]]);
  S.draft={...fresh,...Object.fromEntries(kept),destination:last?.destination||''};
  S.editing=null;dirty=false;persist();go('devis');
}

/* ---------- COMPARATIF ---------- */
let showAll=false,compCarrier='',compSort='cost';
/* Lignes affichées : offres compatibles (ou toutes si le filtre est activé), triées. */
function compRows(R){
  const rows=R.offers.filter(o=>(showAll||o.compat)&&(!compCarrier||o.t.tr===compCarrier));
  const byNum=(x,y,desc)=>{if(x===null||y===null)return (x===null)-(y===null);return desc?y-x:x-y};
  rows.sort((a,b)=>{
    if(compSort==='carrier')return a.t.tr.localeCompare(b.t.tr,'fr');
    if(compSort==='date')return byNum(isNum(a.I)?a.I:null,isNum(b.I)?b.I:null,false);
    return byNum(isNum(a.J)?a.J:null,isNum(b.J)?b.J:null,compSort==='costDesc');
  });
  return rows;
}
/* Une carte : qui, combien, quand, ce qui reste incertain. Le détail se déplie dans la carte. */
function offerCard(R,o,isBest){
  const what=[!isNum(o.tarif)&&'Tarif',!isNum(o.F)&&'Départ'].filter(Boolean);
  const qual=!what.length?'':what.length===2?'Tarif et départ à confirmer':`${what[0]} à confirmer`;
  const hasDate=isNum(o.I);
  const selected=R.sel===o;
  const fig=isNum(o.J)?`${ar(o.J)} / pièce`:'Coût à confirmer';
  const frais=isNum(o.J)&&isNum(o.E)&&isNum(R.achat)?ar(o.J-R.achat-o.E):'—';
  const notes=[o.t.svc?`Service : ${o.t.svc}`:'',o.t.note||'',...calendarFeedback(o)].filter(Boolean);
  return `<article class="offer-card">
   <div class="oc-top"><span>${esc(o.t.tr)} · ${esc(o.t.mode)}</span>${isBest?'<span class="oc-badge">Coût estimé le plus bas</span>':''}${o.compat?'':'<span class="pill">Incompatible</span>'}</div>

   <div class="oc-line"><span>Livraison client</span>${hasDate?`<b>${fd(o.I)}</b><em class="st warn">Date estimée</em>`:'<b>Dates non communiquées</b><em class="st warn">À confirmer</em>'}</div>
   <div class="oc-qual">${qual}</div>
   ${o.compat?`<button class="btn pri oc-pick" data-pick="${esc(o.label)}"${selected?' disabled':''}>${selected?'✓ Offre retenue':'Choisir cette offre'}</button>`:''}
   <details class="oc-more"><summary>Voir le détail</summary><div class="oc-body">
     <div class="oc-kv">
       <div>Tarif</div><div class="num">${isNum(o.tarif)?`${nf.format(o.tarif)} ${esc(o.t.cur)} / ${esc(o.t.unit)}`:'À obtenir'}</div>
       <div>Quantité facturée</div><div class="num">${o.qty!==null?`${dec(o.qty,4)} ${esc(o.t.unit)}`:'—'}</div>
       <div>Produit / pièce</div><div class="num">${isNum(R.achat)?ar(R.achat):'—'}</div>
       <div>Transport / pièce</div><div class="num">${isNum(o.E)?ar(o.E):'—'}</div>
       <div>Frais annexes / pièce</div><div class="num">${frais}</div>
       <div><b>Coût total / pièce</b></div><div class="num"><b>${isNum(o.J)?ar(o.J):'—'}</b></div>
     </div>
     <div class="oc-kv">
       <div>Départ</div><div class="num">${isNum(o.F)?fd(o.F):'À confirmer'}</div>
       <div>Arrivée max</div><div class="num">${isNum(o.G)?fd(o.G):'—'}</div>
       <div>Disponible à Tana</div><div class="num">${isNum(o.Hh)?fd(o.Hh):'—'}</div>
       <div>Livraison client</div><div class="num">${hasDate?fd(o.I):'Non communiquée'}</div>
     </div>
     ${notes.length?`<ul class="oc-notes">${notes.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
   </div></details>
  </article>`;
}

function openCompFilters(){
  const layer=$('#layer'),carriers=[...new Set(S.tarifs.map(t=>t.tr))].sort((a,b)=>a.localeCompare(b,'fr'));
  layer.innerHTML=`<div class="overlay" data-close><div class="card"><h2>Filtres</h2>
   <div class="field"><label for="fCarrier">Transitaire</label><select class="sel" id="fCarrier"><option value="">Tous les transitaires</option>${carriers.map(tr=>`<option value="${esc(tr)}"${tr===compCarrier?' selected':''}>${esc(tr)}</option>`).join('')}</select></div>
