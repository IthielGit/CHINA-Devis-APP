// Capture → Claude (vision + recherche web) → champs du devis. Clé API gardée dans ce navigateur.
const AI_KEY_STORE='devis-transitaires-ai-key';
const AI_MODEL='claude-sonnet-5-5';

const AI_PROMPT=`Tu aides à remplir un devis d’importation Chine vers Madagascar. Les captures montrent souvent un produit sur une boutique chinoise (1688, Taobao, Pinduoduo…), souvent en chinois.

4. Dimensions de l’emballage en cm au format "L x l x H", poids en kg.
5. Pour les champs de catégorie, utilise uniquement les valeurs listées, ou une chaîne vide si c’est inconnu.
Réponds uniquement par un objet JSON, sans texte autour, avec les clés : name (string|null), price_cny (number|null), dims (string|null), weight_kg (number|null), deviceType ("phone"|"computer"|"electronics"|"general"|""), batteryStatus ("none"|"integrated"|"separate"|""), handling ("none"|"liquid"|"powder"|"aerosol"|""), dangerous ("no"|"yes"|""), magnet ("no"|"yes"|""), notes (string : ce qui est incertain et pourquoi).`;
let aiImages=[];
function aiStatus(t,bad){const s=$('#aiStatus');if(!s)return;s.textContent=t;s.style.color=bad?'var(--bad)':''}
function aiRenderThumbs(){const box=$('#aiThumbs');if(!box)return;box.innerHTML=aiImages.map((im,n)=>`<figure class="ai-thumb"><img src="${im.url}" alt="Capture ${n+1}"><button type="button" class="btn" data-ai-remove="${n}" aria-label="Retirer la capture ${n+1}">×</button></figure>`).join('');$('#aiRun').disabled=!aiImages.length}
async function aiResize(file){
  // Réduit la capture (1600 px max, JPEG) : moins de tokens et de données envoyées.
  const src=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',0.85);
    return{url,media_type:'image/jpeg',data:url.split(',')[1]};
  }finally{URL.revokeObjectURL(src)}
}
async function aiAddFiles(files){
  for(const f of files){
    if(f.type&&!f.type.startsWith('image/'))continue;
    if(aiImages.length>=4){aiStatus('Quatre captures au maximum.',true);break}
    try{aiImages.push(await aiResize(f))}catch{aiStatus('Une image n’a pas pu être lue.',true)}
  }
  aiRenderThumbs();
}
function aiMount(){
  aiRenderThumbs();
  const drop=$('#aiDrop'),file=$('#aiFile');if(!drop)return;
  try{$('#aiKey').value=localStorage.getItem(AI_KEY_STORE)||''}catch{}
  $('#aiPick').onclick=e=>{e.stopPropagation();file.click()};
  drop.onclick=()=>file.click();
  drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};
  file.onchange=()=>{aiAddFiles([...file.files]);file.value=''};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');aiAddFiles([...e.dataTransfer.files])};
  $('#aiThumbs').onclick=e=>{const b=e.target.closest('[data-ai-remove]');if(!b)return;aiImages.splice(+b.dataset.aiRemove,1);aiRenderThumbs()};
  $('#aiRun').onclick=()=>aiRun();
  if(!window._aiPaste){window._aiPaste=true;document.addEventListener('paste',e=>{if(!$('#aiDrop'))return;const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();aiAddFiles(files)}})}
}
async function aiRun(){
  const key=($('#aiKey').value||'').trim();
  if(!key){aiStatus('Entrez votre clé API Anthropic.',true);return}
  if(!aiImages.length){aiStatus('Ajoutez au moins une capture.',true);return}
  try{localStorage.setItem(AI_KEY_STORE,key)}catch{}
  const btn=$('#aiRun');btn.disabled=true;aiStatus('Lecture des captures et recherche en cours…');
  const messages=[{role:'user',content:[...aiImages.map(im=>({type:'image',source:{type:'base64',media_type:im.media_type,data:im.data}})),{type:'text',text:AI_PROMPT}]}];
  const sources=new Map();
  try{
    let resp;
    for(let round=0;round<4;round++){
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','anthropic-beta':'server-side-fallback-2026-07-01'},body:JSON.stringify({model:AI_MODEL,max_tokens:2000,fallbacks:'default',tools:[{type:'web_search_20260209',name:'web_search',max_uses:5}],messages})});
      if(!r.ok)throw new Error('Erreur '+r.status+' : '+(await r.text()).slice(0,200));
      resp=await r.json();
      for(const b of resp.content){
        if(b.type==='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>sources.set(x.url,x.title));
        if(b.type==='text'&&b.citations)b.citations.forEach(c=>sources.set(c.url,c.title));
      }
      if(resp.stop_reason!=='pause_turn')break;
      messages.push({role:'assistant',content:resp.content});
    }
    if(resp.stop_reason==='refusal')throw new Error('Le modèle a refusé cette demande.');
    const text=resp.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const m=text.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('Réponse sans données exploitables.');
    aiApply(JSON.parse(m[0]),[...sources].filter(([u])=>u));
  }catch(err){aiStatus(err.message||'Échec de l’analyse.',true)}
  finally{btn.disabled=!aiImages.length}
}
function aiApply(j,sources){
  // Ne remplit que les champs vides : une valeur déjà saisie n’est jamais écrasée.
  const d=S.draft,filled=[],kept=[];
  const empty=v=>v===null||v===undefined||v==='';
  const put=(k,v,label)=>{if(empty(v))return;if(empty(d[k])){d[k]=v;filled.push(label)}else kept.push(label)};
  put('name',j.name,'nom');
  put('price',typeof j.price_cny==='number'?j.price_cny:null,'prix d’achat');
  put('dims',j.dims,'dimensions');
  put('wt',typeof j.weight_kg==='number'?j.weight_kg:null,'poids');
  for(const k in AI_ENUMS)if(AI_ENUMS[k].includes(j[k]))put(k,j[k],k);
  dirty=true;persist();
  document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(k in d)el.value=empty(d[k])?'':String(d[k])});
  refresh();
  const res=$('#aiResult');
  res.innerHTML=`<p><b>Rempli :</b> ${filled.length?filled.map(esc).join(', '):'rien de nouveau'}</p>`
    +(kept.length?`<p><b>Déjà renseigné, conservé :</b> ${kept.map(esc).join(', ')}</p>`:'')
    +(j.notes?`<p>${esc(j.notes)}</p>`:'')
    +(sources.length?`<p><b>Sources :</b></p><ul>${sources.slice(0,8).map(([u,t])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a></li>`).join('')}</ul>`:'')
    +'<p>Vérifiez les valeurs avant d’enregistrer.</p>';
  aiStatus(filled.length?'Champs remplis. Vérifiez-les.':'Aucun champ vide à remplir.');
}

function marketComparison(d,R){
  if(!isNum(d.marketPrice))return '';

  }else messages.push('Votre prix de vente n’est pas encore calculable.');
  if(isNum(R.costP)){
    const margin=d.marketPrice-R.costP;
    profitability=`<div class="${margin>0?'goodtxt':margin<0?'badtxt':'hint'}">${margin>0?`Au prix du marché : rentable, marge estimée ${ar(margin)} / pièce.`:margin<0?`Au prix du marché : non rentable, perte de ${ar(-margin)} / pièce.`:'Au prix du marché : à l’équilibre.'}</div>`;
  }else profitability='<div class="hint">Rentabilité au prix du marché indisponible : le coût de revient n’est pas encore calculé.</div>';
  return `<div class="market-result" role="status">${messages.map(message=>`<div>${message}</div>`).join('')}${profitability}</div>`;

function checkQuote(d,R,p=S.params){
  const errors=[],warnings=[];
  const today=dayNum(new Intl.DateTimeFormat('sv-SE',{timeZone:'Indian/Antananarivo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));
  if(!d.name?.trim())errors.push('Renseignez le nom du produit.');
  if(!Number.isInteger(d.qty)||d.qty<1)errors.push('La quantité doit être un nombre entier supérieur à 0.');
  if(!isNum(d.price)||d.price<0)errors.push('Renseignez un prix d’achat valide (0 est accepté).');
  for(const key of ['usd','cnyUsd','div','arrP','arrV'])if(!isNum(p[key])||p[key]<=0)errors.push('Paramètres invalides : les taux de change, le diviseur et les arrondis doivent être supérieurs à 0.');
  if(!isNum(p.marge)||p.marge<0||!isNum(yuanRate(p))||yuanRate(p)<=0)errors.push('Le taux yuan ou la marge de sécurité du change est invalide.');
  for(const key of ['livCh','exclus','livFin','trans','marge'])if(!isNum(d[key])||d[key]<0)errors.push('Les frais et la marge doivent être des nombres positifs ou nuls.');
  if(!R.sel)errors.push('Choisissez une offre compatible.');
  if(R.use.dims===2&&(!/^\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*$/i.test(d.dims||'')||dimsOf(d).some(n=>n<=0)))errors.push('Renseignez trois dimensions positives : longueur × largeur × hauteur.');
  if(R.use.wt===2&&(!isNum(d.wt)||d.wt<=0))errors.push('Renseignez un poids emballé supérieur à 0.');
  if(!isNum(R.costP)||!isNum(R.costLot)||!isNum(R.pv)||R.pv<0)errors.push('Le coût ou le prix de vente ne peut pas être calculé. Vérifiez les tarifs.');
  if(R.sel&&(!isNum(R.sel.F)||!isNum(R.sel.I)))warnings.push('Départ ou livraison non déterminé : le calendrier peut être incomplet ou dépassé.');
  else if(R.sel&&R.sel.F<today)warnings.push('Le départ calculé est déjà passé. Vérifiez la date de paiement et le calendrier.');
  if(isNum(R.margeLot)&&R.margeLot<0)warnings.push('Vente à perte : le prix de vente est inférieur au coût de revient.');
  return {errors:[...new Set(errors)],warnings};
}

function saveQuote(silent,acknowledged=false){
  const d=S.draft,R=compute(d);
  if(S.quotes.find(q=>q.no===d.no)?.paymentGroupId){toast('Ce devis appartient à un paiement groupé. Dissociez le paiement dans l’historique avant de le modifier.');return}
  const checks=checkQuote(d,R);
  if(checks.errors.length){if(silent!==true)reviewDialog('À corriger avant l’enregistrement',checks.errors);return}
  if(checks.warnings.length&&!acknowledged){if(silent!==true)reviewDialog('Vérifiez ces points',checks.warnings,'Enregistrer malgré ces alertes',()=>saveQuote(false,true));return}
  if(!d.name.trim()){if(silent!==true){toast('Donnez un nom au produit avant d’enregistrer.');$('#f_name').focus()}return}
  if(!R.sel){if(silent!==true)toast('Aucune offre disponible : vérifiez la catégorie et les tarifs.');return}
  const now=new Date().toISOString(),i=S.quotes.findIndex(q=>q.no===d.no);
  const inputs={...copyData(d),mode:'manuel',offer:R.sel.label};
  const rec={no:d.no,created:i>=0?S.quotes[i].created:now,modified:now,inputs,res:snapshot(d,R),offer:R.sel.label};
  const quotes=[...S.quotes];if(i>=0)quotes[i]=rec;else quotes.push(rec);
  if(!commitPaymentState({...S,quotes,editing:d.no}))return;
  dirty=false;drawTabs();refresh();if(silent!==true)toast('Devis '+d.no+' enregistré dans l’historique.');
}

function showQuote(q){
  const r=q.res,i=q.inputs;
  const characteristicNames={batteryStatus:{none:'aucune batterie',integrated:'batterie intégrée',separate:'batterie expédiée séparément'},handling:{none:'ni liquide, ni poudre, ni aérosol',liquid:'liquide',powder:'poudre',aerosol:'aérosol'},dangerous:{no:'pas identifié comme dangereux',yes:'potentiellement dangereux'},magnet:{no:'sans aimant',yes:'avec aimant'},deviceType:{phone:'téléphone',computer:'ordinateur/tablette',electronics:'autre appareil électronique',general:'produit général'}};
  const characteristics=Object.entries(characteristicNames).filter(([key])=>i[key]).map(([key,values])=>values[i[key]]).filter(Boolean);

    <td class="num ${o.i===bd&&o.compat?'best':''}">${isNum(o.I)?fd(o.I):''}</td><td class="r num ${o.i===bp&&o.compat?'best':''}">${isNum(o.J)?ar(o.J):''}</td>

n class="btn pri" type="submit">Enregistrer</button>'}</div></form>`;

/* ---------- CALENDRIER ---------- */
function viewCal(v){
  const P=S.params;
  let period='upcoming';
  v.innerHTML=`<div class="card calendar-card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Période des départs"><button type="button" data-cal-period="upcoming" aria-pressed="true">À venir</button><button type="button" data-cal-period="past" aria-pressed="false">Passés</button><button type="button" data-cal-period="all" aria-pressed="false">Tous</button></div>
  <button class="btn pri" id="cAdd">+ Ajouter un départ</button></div>
  <div class="calendar-filters" role="group" aria-label="Filtrer les départs"><label for="cDateFrom">Du<input class="inp" id="cDateFrom" type="date" aria-describedby="cDateError"></label><label for="cDateTo">Au<input class="inp" id="cDateTo" type="date" aria-describedby="cDateError"></label><label for="cTr">Transitaire<select class="sel" id="cTr"></select></label><label for="cMode">Mode<select class="sel" id="cMode"></select></label><label for="cSvc">Service<select class="sel" id="cSvc"></select></label><button class="btn" id="cReset" type="button">Réinitialiser</button></div>

  <div class="tw"><table><thead><tr><th>Transitaire</th><th>Mode</th><th>Service de l’offre</th><th>Date de départ</th><th>Remarque</th><th>Actions</th></tr></thead><tbody id="cb"></tbody></table></div></div>`;
  const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Indian/Antananarivo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const filterFields=[['cTr','tr','Tous les transitaires'],['cMode','mode','Tous les modes'],['cSvc','svc','Tous les services']];
  const draw=()=>{
    filterFields.forEach(([id,key,label])=>{const el=$('#'+id),selected=el.value;const values=[...new Set(S.cal.map(c=>c[key]||''))].sort((a,b)=>a.localeCompare(b,'fr'));el.innerHTML=`<option value="">${label}</option>`+values.map(value=>`<option value="${esc(value||'__empty__')}">${esc(value||(key==='svc'?'Sans service':'À préciser'))}</option>`).join('');el.value=[...el.options].some(o=>o.value===selected)?selected:''});
    const from=$('#cDateFrom').value,to=$('#cDateTo').value,invalid=!!(from&&to&&from>to);
    $('#cDateFrom').max=to;$('#cDateTo').min=from;
    ['cDateFrom','cDateTo'].forEach(id=>$('#'+id).setAttribute('aria-invalid',String(invalid)));
    $('#cDateError').hidden=!invalid;$('#cDateError').textContent=invalid?'La date de fin doit être égale ou postérieure à la date de début.':'';
    const currentDay=today(),inPeriod=c=>period==='all'||(period==='past'?c.date<currentDay:c.date>=currentDay);
    const rows=S.cal.map((c,i)=>({c,i})).filter(({c})=>inPeriod(c)&&!invalid&&(!from||c.date>=from)&&(!to||c.date<=to)&&filterFields.every(([id,key])=>!$('#'+id).value||(c[key]||'__empty__')===$('#'+id).value)).sort((a,b)=>period==='past'?b.c.date.localeCompare(a.c.date):a.c.date.localeCompare(b.c.date));
    v.querySelectorAll('[data-cal-period]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.calPeriod===period)));
    $('#cCount').textContent=`${rows.length} départ${rows.length>1?'s':''} · ${period==='past'?'du plus récent au plus ancien · consultation uniquement':'par date de départ'}`;
    $('#cReset').disabled=!from&&!to&&!filterFields.some(([id])=>$('#'+id).value);
    $('#cb').innerHTML=rows.map(({c,i})=>{const past=c.date<currentDay;return `<tr><td>${esc(c.tr)}</td><td>${esc(c.mode||'À préciser')}</td><td>${esc(c.svc||'—')}</td><td><b>${esc(fd(dayNum(c.date)))}</b>${past&&period==='all'?' <span class="pill">Passé</span>':''}</td><td>${esc(c.note||'—')}</td><td><div class="row calendar-actions"><button class="btn sm" data-cal-view="${i}">Voir</button>${past?'':`<details class="row-actions" name="calendar-actions"><summary class="btn sm" aria-label="Autres actions pour ${esc(c.tr)} le ${esc(c.date)}">•••</summary><div><button class="btn sm" data-cal-edit="${i}">Modifier</button><button class="btn sm dng" data-cal-delete="${i}">Supprimer</button></div></details>`}</div></td></tr>`}).join('')||`<tr><td colspan="6" class="empty">${invalid?'Corrigez la plage de dates pour afficher les départs.':!S.cal.length?'Aucun départ enregistré. Ajoutez votre premier départ.':from||to||filterFields.some(([id])=>$('#'+id).value)?'Aucun départ ne correspond aux filtres pour cette période.':period==='upcoming'?'Aucun départ à venir. Ajoutez une date ou consultez les départs passés.':'Aucun départ pour cette période.'}</td></tr>`;
  };
  const editor=(index,readOnly=false)=>{
    const existing=index===null?null:S.cal[index];
    if(existing&&existing.date<today()&&!readOnly)return;
    const c=existing?{...existing}:{tr:P.trs[0]||'',mode:'Avion',svc:'',date:today(),note:''};
    const services=(tr,mode)=>calendarServices(tr,mode);
    const optionsHtml=(tr,mode,current,keepLegacy)=>{
      const available=services(tr,mode);
      if(mode==='Maritime')return'<option value="" selected></option>';
      if(available.length===1&&available[0]==='')return'<option value="" selected></option>';
      const options=available.map(service=>`<option value="${esc(service)}"${service===current?' selected':''}>${esc(service)}</option>`);
      if(keepLegacy&&current&&!available.some(service=>serviceKey(service)===serviceKey(current)))
        options.unshift(`<option value="${esc(current)}" selected>${esc(current)} · ancien nom à corriger</option>`);
      return `<option value="">Choisir une offre</option>${options.join('')}`;
    };
    if(!c.svc||!services(c.tr,c.mode).some(service=>serviceKey(service)===serviceKey(c.svc)))
      c.svc=services(c.tr,c.mode)[0]||c.svc;
    let selectedPair={tr:c.tr,mode:c.mode};
    const opener=document.activeElement;
    const dialog=document.createElement('dialog');dialog.className='calendar-dialog';dialog.setAttribute('aria-labelledby','calTitle');
    dialog.innerHTML=`<form><h2 id="calTitle">${readOnly?'Consulter le départ':existing?'Modifier le départ':'Ajouter le départ'}</h2><fieldset ${readOnly?'disabled':''} style="border:0;padding:0;margin:0"><div class="field"><label for="calTr">Transitaire</label><select class="sel" id="calTr" required>${opts([...new Set([...P.trs,c.tr])],c.tr)}</select></div><div class="field"><label for="calMode">Mode</label><select class="sel" id="calMode" required>${opts(['Avion','Maritime'],c.mode,'Choisir un mode')}</select><div class="help">Avion et Maritime ont des offres et des dates séparées.</div></div><div class="field"><label for="calSvc">Service de l’offre transitaire</label><select class="sel" id="calSvc">${optionsHtml(c.tr,c.mode,c.svc,true)}</select><div class="help">La liste reprend les noms de l’onglet « Tarifs ». Pour E-SOA Maritime, l’offre n’a pas de service distinct : laissez ce champ vide.</div><div class="hint" id="calServiceHint"></div></div><div class="field"><label for="calDate">Date de départ</label><input class="inp" id="calDate" type="date" required min="${today()}" value="${esc(c.date)}"></div><div class="field"><label for="calNote">Remarque</label><textarea class="inp" id="calNote">${esc(c.note||'')}</textarea></div></fieldset><p id="calError" class="badtxt" role="alert"></p><div class="row"><button type="button" class="btn" id="calCancel">${readOnly?'Fermer':'Annuler'}</button>${readOnly?'':'<button class="btn pri" type="submit">Enregistrer</button>'}</div></form>`;
    document.body.appendChild(dialog);dialog.showModal();
    dialog.addEventListener('close',()=>{dialog.remove();if(opener&&opener.isConnected)opener.focus()});
    $('#calCancel',dialog).onclick=()=>dialog.close();
    const updateServices=()=>{
      const tr=$('#calTr',dialog).value,mode=$('#calMode',dialog).value,current=$('#calSvc',dialog).value;
      const keepCurrent=selectedPair.tr===tr&&selectedPair.mode===mode;
      const available=services(tr,mode),selected=keepCurrent&&available.some(service=>serviceKey(service)===serviceKey(current))?current:available[0]||'';
      $('#calSvc',dialog).innerHTML=optionsHtml(tr,mode,selected,keepCurrent);
      selectedPair={tr,mode};updateServiceHint();
    };
    const updateServiceHint=()=>{const tr=$('#calTr',dialog).value,mode=$('#calMode',dialog).value,available=services(tr,mode),maritime=mode==='Maritime';$('#calSvc',dialog).disabled=maritime;$('#calSvc',dialog).required=!maritime;$('#calServiceHint').textContent=maritime?(available.length?'Le transport Maritime n’a pas de service sélectionnable ; la date est liée au mode Maritime.':'Aucune offre Maritime enregistrée pour ce transitaire.') :available.some(service=>serviceKey(service)===serviceKey($('#calSvc',dialog).value))?'Ce service correspond directement au nom de l’offre dans Tarifs.':'Ancien nom non reconnu par une offre de ce mode : choisissez un service proposé pour relier cette date.'};
    $('#calTr',dialog).onchange=updateServices;$('#calMode',dialog).onchange=updateServices;$('#calSvc',dialog).onchange=updateServiceHint;updateServiceHint();
    $('form',dialog).onsubmit=e=>{e.preventDefault();if(readOnly)return;const date=$('#calDate',dialog).value,tr=$('#calTr',dialog).value,mode=$('#calMode',dialog).value,svc=mode==='Maritime'?'':$('#calSvc',dialog).value;if(date<today()||(existing&&existing.date<today())){$('#calError',dialog).textContent='Choisissez une date à partir d’aujourd’hui.';return}if(!services(tr,mode).some(service=>serviceKey(service)===serviceKey(svc))){$('#calError',dialog).textContent='Choisissez un service proposé dans Tarifs pour ce transitaire et ce mode.';return}const entry={tr,mode,svc,date,note:$('#calNote',dialog).value.trim()};if(index===null)S.cal.push(entry);else S.cal[index]=entry;persist();draw();dialog.close();toast('Départ enregistré.')};
  };
  draw();
  v.onclick=e=>{
    if(e.target.closest('#cReset')){['cDateFrom','cDateTo',...filterFields.map(([id])=>id)].forEach(id=>$('#'+id).value='');draw()}
    if(e.target.closest('#cAdd'))editor(null);
    const periodButton=e.target.closest('[data-cal-period]');if(periodButton){period=periodButton.dataset.calPeriod;draw()}
    const view=e.target.closest('[data-cal-view]');if(view)editor(+view.dataset.calView,true);
    const edit=e.target.closest('[data-cal-edit]');if(edit&&!edit.disabled)editor(+edit.dataset.calEdit);
    const b=e.target.closest('[data-cal-delete]');if(b&&!b.disabled){const index=+b.dataset.calDelete;if(S.cal[index].date<today())return;if(b.dataset.sure){S.cal.splice(index,1);persist();draw();toast('Départ supprimé.')}else{b.dataset.sure='1';b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Supprimer'}},4000)}}
  };
  v.onchange=e=>{if(e.target.closest('.calendar-filters'))draw()};
  v.onkeydown=e=>{if(e.key==='Escape'){const menu=e.target.closest('.row-actions');if(menu){menu.open=false;menu.querySelector('summary').focus()}}};
}

/* ---------- PARAMETRES ---------- */
function viewParams(v){
  const P=S.params;
  const pf=(id,label,key,help,unit,extra='')=>`<div class="field"><label for="${id}">${label}</label><div class="unit"><input class="inp" id="${id}" data-p="${key}" type="number" step="any" min="0" value="${P[key]}">${unit?`<span>${unit}</span>`:''}</div><div class="help">${help}</div></div>`;
  const list=(key,label,help)=>`<section class="card"><h2>${label}</h2><div class="chips" data-list="${key}">${P[key].map((x,i)=>`<span class="chip">${key==='margins'?Math.round(x*100)+' %':esc(x)}<button data-rm="${key}:${i}" title="Retirer" aria-label="Retirer">×</button></span>`).join('')}</div>
    <div class="row"><input class="inp txt" id="add_${key}" placeholder="${key==='margins'?'ex. 40 (pour 40 %)':'Nouvel élément'}" style="max-width:220px"><button class="btn" data-add="${key}">Ajouter</button></div><div class="hint" style="margin-top:6px">${help}</div></section>`;
  v.innerHTML=`<div class="params-grid"><div class="stack">
  <section class="card"><h2>Taux de change</h2>
   ${pf('p_usd','Taux USD → Ar','usd','Taux de base. La marge de sécurité s’y ajoute pour le yuan.','Ar')}
   ${pf('p_cny','¥ pour 1 USD','cnyUsd','Conversion yuan ↔ dollar réellement obtenue.','¥')}
   <div class="field"><label for="p_marge">Marge de sécurité sur le change</label><div class="unit"><input class="inp" id="p_marge" data-p="marge" data-pct="1" type="number" step="any" min="0" value="${Number((P.marge*100).toPrecision(12))}"><span>%</span></div><div class="help">Couvre les frais et les variations de change.</div></div>
   <div class="field"><label>Taux yuan → Ar (calculé)</label><div class="num" id="p_yr"></div><div class="help">Taux USD → Ar × (1 + marge) ÷ ¥ pour 1 USD.</div></div>
   <details class="params-advanced"><summary>Règles de calcul avancées</summary>
   ${pf('p_div','Diviseur poids volumétrique (avion)','div','L × l × H (cm) ÷ diviseur = kg volumétrique.','')}
   <div class="field"><label for="p_arrP">Arrondi du poids facturé</label><select class="sel" id="p_arrP" data-p="arrP">${ARR_P.map(x=>`<option value="${x}"${x===P.arrP?' selected':''}>${dec(x,2)} kg</option>`).join('')}</select><div class="help">Palier supérieur : avec 0,01, 4,573 kg → 4,58 kg.</div></div>
   <div class="field"><label for="p_arrV">Arrondi du volume facturé</label><select class="sel" id="p_arrV" data-p="arrV">${ARR_V.map(x=>`<option value="${x}"${x===P.arrV?' selected':''}>${x<1e-6?'volume exact':dec(x,3)+' m³'}</option>`).join('')}</select><div class="help">Volume exact : sans arrondi.</div></div></details>
  </section>
  <section class="card"><h2>Délais</h2>
   ${pf('p_dispo','Mise à disposition après trajet','dispo','Douane, déchargement, traitement (exclus du délai annoncé).','jours')}
   ${pf('p_mA','Marge client avion','mAvion','Prévoir 3 à 5 jours de réserve.','jours')}
   ${pf('p_mM','Marge client maritime','mMar','Prévoir 7 à 14 jours.','jours')}
   <div class="field"><label for="p_dim">Retrait possible le dimanche ?</label><select class="sel" id="p_dim" data-p="dimanche">${opts(['Oui','Non'],P.dimanche)}</select><div class="help">Si « Non », une disponibilité un dimanche passe au lundi.</div></div>
   <div class="field"><label for="p_calendarClosePolicy">Dates publiées trop proches de l’heure limite</label><select class="sel" id="p_calendarClosePolicy" data-calendar-policy><option value="exclude"${P.calendarClosePolicy==='exclude'?' selected':''}>Écarter ces dates (recommandé)</option><option value="keep"${P.calendarClosePolicy==='keep'?' selected':''}>Les garder</option></select><div class="help">Garder une date trop proche, c’est promettre un départ que la marchandise peut rater si elle arrive après l’heure limite au dépôt.</div></div>
  </section>
  </div><div class="stack">
  ${list('cats','Catégories de produit','Associez ensuite vos catégories aux offres dans Tarifs.')}
  ${list('trs','Transitaires','Apparaissent dans les listes des onglets Tarifs et Calendrier.')}
  ${list('svcs','Services','Standard, Express, Fast…')}
  ${list('margins','Taux de marge proposés','Choix disponibles dans « Votre prix de vente ».')}
  <section class="card"><h2>Sauvegarde des données</h2><p class="hint" style="margin-top:0">Tout est enregistré automatiquement dans ce navigateur. Exportez un fichier pour garder une copie ou changer d’appareil.</p>
   <div class="row"><button class="btn pri" id="bExp">Exporter (JSON)</button><label class="btn" for="bImp">Importer…</label><input id="bImp" type="file" accept=".json,application/json" hidden><button class="btn dng" id="bReset">Réinitialiser</button></div><div id="expOut"></div></section></div></div>`;
  const yr=()=>{$('#p_yr').textContent=isNum(yuanRate(P))?dec(yuanRate(P))+' Ar / ¥':'—';drawTabs()};yr();
  v.oninput=v.onchange=e=>{const el=e.target;if(el.dataset.calendarPolicy!==undefined){P.calendarClosePolicy=el.value;persist();return}if(el.dataset.p){let x=el.tagName==='SELECT'&&el.id!=='p_dim'?Number(el.value):el.value;if(el.type==='number')x=el.value===''?0:Number(el.value);if(el.dataset.pct)x=x/100;P[el.dataset.p]=x;persist();yr()}};
  v.onclick=e=>{
    const r=e.target.closest('[data-rm]');if(r){const[k,i]=r.dataset.rm.split(':');P[k].splice(+i,1);persist();viewParams(v);return}
    const a=e.target.closest('[data-add]');if(a){const k=a.dataset.add,inp=$('#add_'+k);let x=inp.value.trim();if(!x)return;if(k==='margins'){x=Number(x.replace(',','.'))/100;if(!isFinite(x)||x<0)return}if(P[k].includes(x))return;P[k].push(x);if(k==='margins')P[k].sort((a,b)=>a-b);persist();viewParams(v)}
    if(e.target.id==='bExp')exportData();
    if(e.target.id==='bReset'){const b=e.target;if(b.dataset.sure){localStorage.removeItem(KEY);S=load();location.reload()}else{b.dataset.sure=1;b.textContent='Tout effacer ? Cliquez encore';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Réinitialiser'}},4000)}}
  };
  $('#bImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.params||!j.tarifs)throw 0;S=normAll(j);persist();toast('Données importées.');go('params');drawTabs()}catch(x){toast('Fichier invalide.')}};
}
async function exportData(){
  const txt=JSON.stringify(S,null,1),name='devis-transitaires-'+dayStr(Math.floor(Date.now()/864e5))+'.json';
  const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Téléchargement de la sauvegarde lancé.');
}

/* ---------- GUIDE ---------- */
function viewGuide(v){
  v.innerHTML=`<div class="card guide" style="margin-top:16px;max-width:820px"><h2>Mode d’emploi : faire un devis en 5 minutes</h2>
  <p>Renseignez les champs du formulaire : les résultats se recalculent automatiquement. Le brouillon reste dans ce navigateur ; utilisez « Enregistrer le devis » pour le retrouver dans l’historique.</p>
  <h3>Étape 1 : récupérer les infos du vendeur</h3><p>Demandez pour UN produit : taille emballée en cm, poids avec emballage en kg. Notez le prix d’une pièce en yuan.</p>
  <h3>Étape 2 : classer le produit</h3><p>Dans le devis, ouvrez « Aide au choix : caractéristiques de transport » et indiquez, si vous les connaissez, la batterie (intégrée ou expédiée séparément), le liquide/poudre/aérosol, le danger, l’aimant et le type d’article. La catégorie proposée explique son motif et indique combien d’offres configurées l’acceptent. Confirmez les consignes particulières auprès du transitaire ; vous pouvez toujours choisir une autre catégorie manuellement.</p>
  <h3>Étape 3 : remplir l’onglet Devis</h3><p>Six champs suffisent pour commencer : nom, prix, quantité, dimensions (écrivez par exemple 14 x 6 x 6), poids et catégorie. Vérifiez la catégorie proposée et le nombre d’offres correspondantes. Les frais annexes, dates et base de facturation sont dans « Dates et frais supplémentaires ».</p>
  <h3>Étape 4 : choisir l’offre</h3><p>L’offre la moins chère est choisie automatiquement. Basculez sur « Plus rapide » ou « Choix manuel » si besoin. La section « Les alternatives » présente les meilleures offres. L’onglet Comparatif montre toutes les offres côte à côte.</p>
  <h3>Étape 5 : lire le résultat</h3><p>Le résumé compare une pièce à la commande complète : si vous saisissez une quantité de 9, la commande contient 9 pièces du même produit. Les frais de transaction sont payés une seule fois, convertis en ariary puis répartis sur les pièces. Ils sont inclus dans le coût unitaire, le prix conseillé et la marge. La marge de la commande correspond au total des ventes moins le coût total. Mettez 0 si ces frais sont déjà comptés dans un autre devis payé en même temps. La date affichée est la livraison client estimée ; les autres étapes sont détaillées dans le calendrier.</p>
  <h3>Étape 6 : prix de vente et marge</h3><p>Choisissez « Calculer avec la marge » pour obtenir un prix automatique ou « Fixer mon prix » pour saisir un prix manuel. Modifier la marge ne change jamais le coût de revient. Ouvrez « Comparer au prix du marché » pour saisir le prix observé d’un produit comparable et voir l’écart avec votre prix ainsi que la rentabilité estimée à ce prix de marché. Ce repère est facultatif et n’affecte pas le calcul du devis.</p>
  <h3>Étape 7 : numéro de devis et historique</h3><p>Chaque devis a un numéro (DEV-0001, DEV-0002…). « Nouveau devis » ouvre un formulaire vide. « Enregistrer le devis » contrôle les mesures requises et les taux, puis signale les départs dépassés et les ventes à perte. Les erreurs bloquent l’enregistrement ; les alertes demandent votre confirmation. Le brouillon est conservé automatiquement, mais une modification d’un devis enregistré doit être enregistrée explicitement.</p>
  <h3>Produits payés ensemble</h3><p>Dans Historique, « Grouper un paiement » permet de sélectionner au moins deux devis et de saisir une référence, les frais uniques en yuans et leur taux de conversion. Les frais sont répartis au prorata du nombre de pièces, avec un ajustement au centime pour que la somme soit exacte. Chaque devis remplace ses anciens frais par sa part commune. Les tarifs et achats enregistrés restent identiques ; les prix calculés avec la marge sont ajustés et les prix manuels restent fixes. Les devis groupés sont verrouillés. « Dissocier le paiement » restaure leurs valeurs avant regroupement. Une duplication démarre un nouveau paiement individuel.</p>
  <h3>Mettre à jour les tarifs</h3><p>Onglet Tarifs : recherchez une offre, puis cliquez « Voir » ou « Modifier ». Seul « Enregistrer » applique vos modifications ; « Annuler » les abandonne. Une suppression demande confirmation. Nouveau transitaire : ajoutez-le dans Paramètres, puis ajoutez une offre.</p>
  <h3>Calendrier des départs</h3><p>Les services du calendrier reprennent directement les offres enregistrées dans l’onglet Tarifs. Choisissez le transitaire et le mode : la liste affiche les noms d’offre correspondants. Il n’y a pas de table de correspondance à maintenir. Chez E-SOA, le transport Maritime n’a pas de service distinct : laissez le champ Service vide dans Tarifs et Calendrier. Les services Avion sont Normal et Express. Si un service manque, ajoutez ou corrigez d’abord l’offre dans Tarifs. Avion et Maritime restent séparés.</p>
  <h3>Saisir une date de départ</h3><p>Dans Calendrier, choisissez le transitaire, le mode et le service de l’offre, puis la date. La date est appliquée aux tarifs ayant le même transitaire, mode et nom de service, quelle que soit la catégorie. Elle remplace leurs jours de départ habituels. Les devis déjà enregistrés ne changent pas ; seuls les nouveaux calculs et les devis modifiés utilisent les règles actuelles.</p>
  <h3>Dates trop proches de l’heure limite</h3><p>Dans Paramètres, choisissez « Écarter ces dates » (par défaut et recommandé) ou « Les garder ». Quand une date publiée est écartée, le devis indique la date concernée, l’heure d’arrivée estimée au dépôt et l’heure limite manquée. « Les garder » permet de retenir cette date, mais le même avertissement s’affiche : promettre ce départ comporte le risque que la marchandise arrive après l’heure limite au dépôt et le rate.</p>
  <h3>Mettre à jour les paramètres</h3><p>Onglet Paramètres : taux USD → Ar, marge de sécurité sur le change et ¥ pour 1 USD. Le taux yuan → Ar se calcule tout seul. Mettez aussi à jour les marges client et le retrait le dimanche.</p>
<p>Chaque nouveau devis enregistré conserve une copie du tarif, des paramètres, de la correspondance et des dates calendrier utilisés. Dans Historique → Voir, ouvrez « Données sources et paramètres figés lors du calcul » pour consulter cette copie et vérifier que le recalcul redonne le même résultat. Modifier les tarifs ensuite ne change pas l’archive. Les anciens devis restent consultables, mais ceux enregistrés avant l’ajout de cet instantané sont signalés comme ne disposant pas des sources et paramètres d’origine.</p>
  <h3>Sauvegarde</h3><p>Paramètres, section Sauvegarde : exportez un fichier JSON pour garder une copie ou utiliser l’outil sur un autre appareil, puis importez-le.</p>
  <p class="hint">Un exemple est déjà rempli : 1 spray anti-pluie 50 ml à ¥4,04, colis estimé 14 × 6 × 6 cm et 0,08 kg. Cliquez « Nouveau devis » pour partir d’un formulaire vide.</p></div>`;
}

function applyTheme(theme){document.documentElement.dataset.theme=theme;const button=$('#themeToggle');button.textContent=theme==='dark'?'☀':'☾';button.setAttribute('aria-label',theme==='dark'?'Activer le thème clair':'Activer le thème sombre');button.title=button.getAttribute('aria-label')}
let storedTheme;try{storedTheme=localStorage.getItem('devis-transitaires-theme')}catch{}
applyTheme(storedTheme==='dark'||storedTheme==='light'?storedTheme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#themeToggle').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(theme);try{localStorage.setItem('devis-transitaires-theme',theme)}catch{}};
document.documentElement.lang='fr';
drawTabs();go(S.tab&&TABS.some(t=>t[0]===S.tab)?S.tab:'devis');
</script>
