<script>
/* Retour : chaque écran et chaque fenêtre ouverte est une entrée d’historique. Le bouton Android (retour du système) et le bouton ‹ reviennent d’une étape : fenêtre, écran précédent, Devis. */
(function(){
  const navStack=[];let restoring=false,ignorePop=false,pendingFn=null,internal=false,wasOpen=false;
  const goBase=go;
  const layerEl=()=>document.getElementById('layer');
  const layerOpen=()=>!!layerEl().innerHTML.trim();
  const hasEntry=()=>!!(history.state&&history.state.chinaDevisApp);
  function push(){try{history.pushState({chinaDevisApp:Date.now()},'')}catch(e){}}
  function updateBack(){const b=document.getElementById('mBack');if(b)b.hidden=!(layerOpen()||navStack.length)}
  go=function(k){
    const prev=S.tab;goBase(k);
    if(!restoring&&prev!==k){if(navStack[navStack.length-1]!==prev)navStack.push(prev);push()}
    updateBack();
  };
  function closeLayerSilently(){internal=true;layerEl().innerHTML='';internal=false;wasOpen=false}
  // Retour d’une étape, sans dépendre de l’historique du navigateur
  function logicalBack(){
    if(layerOpen()){closeLayerSilently();updateBack();return}
    if(navStack.length){const t=navStack.pop();restoring=true;try{go(t)}finally{restoring=false}return}
    if(S.tab!=='devis'){restoring=true;try{go('devis')}finally{restoring=false}}
    updateBack();
  }
  // Fenêtre fermée par l’utilisateur (bouton Fermer, fond, éléments de menu) : on retire aussi son entrée d’historique
  new MutationObserver(()=>{
    const open=layerOpen();
    if(open&&!wasOpen){wasOpen=true;if(!internal)push()}
    else if(!open&&wasOpen){wasOpen=false;if(!internal){ignorePop=true;history.back()}}
    updateBack();
  }).observe(layerEl(),{childList:true});
  window.addEventListener('popstate',()=>{
    if(ignorePop){ignorePop=false;return}
    if(pendingFn){const f=pendingFn;pendingFn=null;closeLayerSilently();f();return}
    logicalBack();
  });
  window.mBack=()=>{if(hasEntry())history.back();else logicalBack()};
  window.mAfterClose=fn=>{if(hasEntry()&&layerOpen()){pendingFn=fn;history.back()}else{closeLayerSilently();fn()}};
  window.mGoFromMenu=k=>window.mAfterClose(()=>go(k));
  const top=document.querySelector('.top');
  const btn=document.createElement('button');
  btn.id='mBack';btn.type='button';btn.className='m-back';btn.hidden=true;btn.setAttribute('aria-label','Retour');
  btn.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
  btn.onclick=()=>window.mBack();
  top.prepend(btn);
  updateBack();
})();
</script>

<script>
/* Barre d’action du devis : affiche le bouton Enregistrer en bas de l’écran, sur l’onglet Devis seulement. */
(function(){
  const bar=document.getElementById('mBar');
  document.getElementById('mSave').addEventListener('click',()=>{const b=document.getElementById('bSave');if(b)b.click()});
  /* Le prix de vente est recopié depuis le devis (ses éléments changent à chaque recalcul : on ne réécrit que si la valeur change). */
  function sync(){
    const on=S.tab==='devis';
    if(bar.hidden===on)bar.hidden=!on;
    const text=document.querySelector('#quoteSellPrice b')?.textContent||'',value=document.getElementById('mPriceValue'),box=document.getElementById('mPrice');
    if(value.textContent!==text)value.textContent=text;
    if(box.hidden!==!text)box.hidden=!text;
  }
  new MutationObserver(sync).observe(document.body,{subtree:true,childList:true,characterData:true});
  sync();
})();

<script>
/* Historique : toucher un devis ouvre le menu Voir · Modifier · Dupliquer · Supprimer. */
(function(){
  const layer=document.getElementById('layer');
  function openSheet(no){
    const q=S.quotes.find(x=>x.no===no);if(!q)return;
    const d=`data-no="${esc(q.no)}"`;
    layer.innerHTML=`<div class="overlay" data-close><div class="card"><h2>${esc(q.no)} · ${esc(q.inputs.name)}</h2><p class="hint">${ar(q.res.pv)} / pièce · ${esc(q.res.tr)}</p><div class="more-list">
      <button class="btn more-item" data-qa="view" ${d}>Voir</button>
      <button class="btn more-item" data-qa="edit" ${d}>Modifier</button>
      <button class="btn more-item" data-qa="dup" ${d}>Dupliquer</button>
      <button class="btn more-item dng" data-qa="del" ${d}>Supprimer</button>
      <button class="btn more-item m-close" data-close>Fermer</button></div></div></div>`;
  }
  function confirmDelete(no){
    layer.innerHTML=`<div class="overlay" data-close><div class="card"><h2>Supprimer ${esc(no)} ?</h2><p class="hint">Le devis sera retiré de l’historique. Son numéro ne sera pas réutilisé.</p><div class="more-list"><button class="btn more-item dng" data-qa="del-ok" data-no="${esc(no)}">Supprimer</button><button class="btn more-item m-close" data-close>Annuler</button></div></div></div>`;
  }
  window.mQuoteAction=(a,no)=>{
    const q=S.quotes.find(x=>x.no===no);if(!q)return;
    if(a==='view'){showQuote(q);return}
    // Mêmes règles que l’historique du bureau (quoteActionBlock), vérifiées au moment de l’action.
    const block=quoteActionBlock(q,a==='del-ok'?'del':a);
    if(block){toast(block);return}
    if(a==='del'){confirmDelete(no);return}
    if(a==='del-ok'){window.mAfterClose(()=>{S.quotes=S.quotes.filter(x=>x.no!==no);persist();drawTabs();drawHisto();toast('Devis '+no+' supprimé.')});return}
    if(a==='edit'){window.mAfterClose(()=>openQuoteForEdit(q));return}
    if(a==='dup'){window.mAfterClose(()=>duplicateQuote(q));return}
  };
  document.addEventListener('click',e=>{
    if(!e.target.closest||!e.target.closest('#hlist'))return;
    const card=e.target.closest('[data-card-no]');if(card){openSheet(card.dataset.cardNo);return}
    if(e.target.closest('[data-a]'))return;
    const tr=e.target.closest('tbody tr');if(!tr)return;
    const no=tr.cells[0].childNodes[0].textContent.trim();
    openSheet(no);
  });
  layer.addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(b)window.mQuoteAction(b.dataset.qa,b.dataset.no)});
})();
</script>

<script>
/* Effets : écran d'ouverture, entrée en cascade, chiffres qui s'animent, transition entre écrans, retour haptique (Capacitor). */
(function(){
  const mobile=matchMedia('(max-width:760px)').matches;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(mobile&&!reduce){
    const splash=document.createElement('div');splash.id='appSplash';splash.setAttribute('aria-hidden','true');
    splash.innerHTML='<div class="mark"><svg viewBox="0 0 512 512" width="46" height="46" aria-hidden="true"><path d="M256 96 L400 170 L400 342 L256 416 L112 342 L112 170 Z" fill="#ffffff" fill-opacity="0.22"/><path d="M256 96 L400 170 L256 244 L112 170 Z" fill="#ffffff"/><path d="M112 170 L256 244 L256 416 L112 342 Z" fill="#E7F3EF"/><path d="M400 170 L256 244 L256 416 L400 342 Z" fill="#ffffff" fill-opacity="0.82"/><path d="M256 244 V416" stroke="#0F766E" stroke-width="12" stroke-linecap="round"/></svg></div><p>Devis Transitaires</p>';
    document.body.appendChild(splash);
    setTimeout(()=>splash.remove(),1500);
  }
  function haptic(){
    try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H){H.impact({style:'LIGHT'});return}}catch(e){}
    try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  }
  /* Montant qui part de 0 jusqu'à sa valeur ; le texte final est rétabli à l'identique. */
  function countUp(el){
    const raw=el.textContent;
    const m=raw.match(/^(\D*)([\d\s\u00a0\u202f]*\d)(.*)$/);
    if(!m||/[.,]\d/.test(raw))return;
    const target=parseInt(m[2].replace(/\D/g,''),10);
    if(!Number.isFinite(target)||target>1e12)return;
    const prefix=m[1],suffix=m[3],t0=performance.now(),dur=520;
    el.textContent=prefix+'0'+suffix;
    function step(t){
      const p=Math.min(1,(t-t0)/dur),v=Math.round(target*(1-Math.pow(1-p,3)));
      el.textContent=p<1?prefix+v.toLocaleString('fr-FR')+suffix:raw;
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function enter(){
    const view=document.getElementById('view');if(!view)return;
    view.classList.remove('enter-view');void view.offsetWidth;view.classList.add('enter-view');
    [...view.querySelectorAll('.card,.dash-tile,.dash-row,.dash-focus,.dash-heading,.dash-greet')].slice(0,14).forEach((el,i)=>{el.classList.add('enter');el.style.animationDelay=(i*55)+'ms'});
    view.querySelectorAll('.dash-big,#sellingPrice').forEach(countUp);
  }
  const goBase=go;
  go=function(k){goBase(k);enter()};
  enter();
  document.addEventListener('click',e=>{
    if(e.target.closest('.tab,.nav-more,#mSave,#bSave'))haptic();
  });
})();
</script>

<script>
/* Infobulles : un toucher sur le « i » affiche le texte ; un second toucher, ou un toucher ailleurs, le ferme. */
(function(){
  let bubble=null;
  function close(){if(bubble)bubble.remove();bubble=null}
  document.addEventListener('click',e=>{
    const info=e.target.closest('.field-info');
    if(!info){if(bubble)close();return}
    e.preventDefault();
    const same=bubble&&bubble._src===info;
    close();
    if(same)return;
    bubble=document.createElement('div');
    bubble.className='info-bubble';bubble.setAttribute('role','tooltip');
    bubble.textContent=info.getAttribute('title')||info.getAttribute('aria-label')||'';
    bubble._src=info;
    document.body.appendChild(bubble);
    const r=info.getBoundingClientRect(),w=Math.min(260,innerWidth-24);
    bubble.style.width=w+'px';
    bubble.style.left=Math.max(12,Math.min(r.left+r.width/2-w/2,innerWidth-w-12))+'px';
    bubble.style.top=(r.bottom+8)+'px';
  });
  window.addEventListener('scroll',close,{passive:true});
})();
</script>

<script>
/* Devis en étapes (téléphone) : Produit, Transport, Prix, un seul bloc à la fois. Une aide longue (texte sous un champ) devient une infobulle « i ». */
(function(){
  const mq=matchMedia('(max-width:760px)');
  const STEPS=['Produit','Transport','Prix'];
  let cur=0,lastTab=null;
  const head=document.createElement('nav');
  head.className='m-steps';head.setAttribute('aria-label','Étapes du devis');
  head.innerHTML=STEPS.map((s,i)=>`<button type="button" data-wiz-go="${i}">${s}</button>`).join('');
  const wiz=document.createElement('div');
  wiz.className='m-wiz';
  wiz.innerHTML='<button type="button" class="btn" data-wiz="-1">Retour</button><button type="button" class="btn pri" data-wiz="1">Suivant</button>';
  const msg=document.createElement('p');
  msg.className='m-wiz-msg';msg.setAttribute('role','alert');msg.hidden=true;
  wiz.prepend(msg);
  /* Champs obligatoires, mêmes règles que le bureau (checkQuote) : Nom, Prix d’achat, Quantité ; Dimensions et Poids seulement si l’offre les utilise ; Destination et une offre avant la suite. */
  const REQ=[['f_name','Nom du produit'],['f_cat','Catégorie'],['f_price','Prix d’achat'],['f_qty','Quantité'],['f_dims','Dimensions emballées'],['f_wt','Poids emballé'],['f_destination','Destination']];
  function missing(step){
    const d=S.draft,R=compute(d),out=[];
    if(!String(d.name||'').trim())out.push(['f_name','Nom du produit']);
    if(!(d.price!==null&&d.price!==''&&+d.price>=0))out.push(['f_price','Prix d’achat']);
    if(!(Number.isInteger(+d.qty)&&+d.qty>=1))out.push(['f_qty','Quantité']);
    if(R.use.dims===2&&(!/^\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*[x×*]\s*\d+(?:[.,]\d+)?\s*$/i.test(d.dims||'')||dimsOf(d).some(n=>n<=0)))out.push(['f_dims','Dimensions emballées']);
    if(R.use.wt===2&&!(+d.wt>0))out.push(['f_wt','Poids emballé']);
    if(step>=1){
      if(!d.destination)out.push(['f_destination','Destination']);
      if(!R.sel)out.push([null,'une offre compatible']);
    }
    return out;
  }
  function showMissing(list){
    document.querySelectorAll('.m-invalid').forEach(el=>el.classList.remove('m-invalid'));
    list.forEach(([id])=>{if(id)boxFor(id)?.classList.add('m-invalid')});
    msg.textContent='Pour continuer, renseignez : '+list.map(([,l])=>l).join(', ')+'.';
    msg.hidden=false;
    const first=list.find(([id])=>id);
    if(first)document.getElementById(first[0])?.closest('.field')?.scrollIntoView({behavior:'smooth',block:'center'});
  }
  /* Élément affiché pour un champ : les cases des dimensions et les boutons de destination remplacent les champs cachés. */
  function boxFor(id){
    if(id==='f_dims')return document.querySelector('.m-dims');
    if(id==='f_destination')return document.querySelector('.m-dest');
    return document.getElementById(id);
  }
  /* Dimensions : trois cases ; le champ d’origine « 14 x 6 x 6 » est recopié à chaque saisie. */
  function dimsSync(){
    const f=document.getElementById('f_dims');if(!f)return;
    let box=f.nextElementSibling;
    if(!box||!box.classList.contains('m-dims')){
      box=document.createElement('div');box.className='m-dims';
      box.innerHTML='<input type="text" inputmode="decimal" data-dim="0" aria-label="Longueur (cm)" placeholder="L"><span>×</span><input type="text" inputmode="decimal" data-dim="1" aria-label="Largeur (cm)" placeholder="l"><span>×</span><input type="text" inputmode="decimal" data-dim="2" aria-label="Hauteur (cm)" placeholder="H"><em>cm</em>';
      f.after(box);f.style.display='none';
    }
    const parts=f.value.match(/\d+(?:[.,]\d+)?/g)||[];
    box.querySelectorAll('input').forEach((el,i)=>{
      if(el!==document.activeElement&&el.value!==(parts[i]||''))el.value=parts[i]||'';
    });
  }
  /* Destination : deux boutons (Stock boutique / Commande client) qui règlent la liste d’origine. */
  function destSync(){
    const sel=document.getElementById('f_destination');if(!sel)return;
    let seg=sel.nextElementSibling;
    if(!seg||!seg.classList.contains('m-dest')){
      seg=document.createElement('div');seg.className='seg m-dest';seg.setAttribute('role','group');seg.setAttribute('aria-label','Destination');
      seg.innerHTML=[...sel.options].filter(o=>o.value).map(o=>`<button type="button" data-dest="${o.value}">${o.textContent}</button>`).join('');
      sel.after(seg);sel.style.display='none';
    }
    seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dest===sel.value)));
  }
  /* Astérisque sur chaque champ obligatoire ; dimensions et poids seulement quand l’offre les demande. */
  function marks(){
    const R=compute(S.draft);
    REQ.forEach(([id])=>{
      const lab=document.querySelector(`label[for="${id}"]`);if(!lab)return;
      if(!lab.querySelector('.m-req')){const s=document.createElement('span');s.className='m-req';s.textContent=' *';s.setAttribute('aria-hidden','true');lab.appendChild(s)}
      if(id==='f_dims')lab.querySelector('.m-req').hidden=R.use.dims!==2;
      if(id==='f_wt')lab.querySelector('.m-req').hidden=R.use.wt!==2;
    });
  }
  /* Bloc de chaque étape, et l’endroit où loger Retour / Suivant */
  function blocks(cols){
    const produit=cols.querySelector('#stepProduit'),transport=cols.querySelector('#stepTransport'),right=document.getElementById('right');
    if(!produit||!transport||!right)return null;
    const transportStack=transport.parentElement;
    return [{els:[produit],host:produit},{els:[transportStack],host:transportStack},{els:[right],host:right}];
  }
  /* Le texte d’aide sous un champ part dans une infobulle « i » à côté du libellé. L’élément d’aide reste dans la page (masqué) : le code du bureau le met à jour. */
  function helpToInfo(cols){
    cols.querySelectorAll('.field > .help').forEach(h=>{
      const label=h.parentElement.querySelector(':scope > label');
      if(!label)return;
      if(!h._info){
        const b=document.createElement('button');
        b.type='button';b.className='field-info';b.textContent='i';
        label.appendChild(b);h._info=b;
        h.style.display='none';
      }
      const text=h.textContent.trim();
      h._info.title=text;h._info.setAttribute('aria-label','Information : '+text);
      h._info.style.display=text?'':'none';
    });
  }
  function sync(){
    if(!mq.matches)return;
    const cols=document.querySelector('.quote-cols');if(!cols)return;
    const B=blocks(cols);if(!B)return;
    const tab=typeof S!=='undefined'?S.tab:null;
    if(tab!==lastTab){lastTab=tab;if(tab==='devis')cur=0}
    helpToInfo(cols);
    if(head.parentElement!==cols)cols.prepend(head);
    B.forEach((b,i)=>b.els.forEach(el=>el.classList.toggle('m-off',i!==cur)));
    const host=B[cur].host;
    if(wiz.parentElement!==host)host.appendChild(wiz);
    wiz.querySelector('[data-wiz="-1"]').hidden=cur===0;
    wiz.querySelector('[data-wiz="1"]').hidden=cur===STEPS.length-1;
    marks();
    dimsSync();
    destSync();
    head.querySelectorAll('button').forEach((b,i)=>{if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  }
  document.addEventListener('click',e=>{
    const w=e.target.closest('[data-wiz]'),j=e.target.closest('[data-wiz-go]');
    if(!w&&!j)return;
    const target=Math.max(0,Math.min(STEPS.length-1,w?cur+Number(w.dataset.wiz):Number(j.dataset.wizGo)));
    if(target>cur){
      /* Avancer : toutes les étapes jusqu’à l’étape en cours doivent être complètes */
      const miss=missing(cur);
      if(miss.length){showMissing(miss);return}
    }
    msg.hidden=true;
    document.querySelectorAll('.m-invalid').forEach(el=>el.classList.remove('m-invalid'));
    cur=target;
    sync();
    head.scrollIntoView({behavior:'smooth',block:'start'});
  });
  /* Saisie d’une case de dimension : on recopie « L x l x H » dans le champ d’origine, qui prévient le bureau. */
  document.addEventListener('input',e=>{
    const cell=e.target.closest&&e.target.closest('.m-dims input');
    if(cell){
      const box=cell.closest('.m-dims'),f=document.getElementById('f_dims');
      const v=[...box.querySelectorAll('input')].map(x=>x.value.trim());
      f.value=v.every(x=>!x)?'':v.map(x=>x||'_').join(' x ').replace(/_/g,'');
      f.dispatchEvent(new Event('input',{bubbles:true}));
      box.classList.remove('m-invalid');
      return;
    }
    const t=e.target.closest&&e.target.closest('.m-invalid');
    if(t)t.classList.remove('m-invalid');
    if(e.target.classList&&e.target.classList.contains('m-invalid'))e.target.classList.remove('m-invalid');
  });
  /* Destination : un toucher règle la liste d’origine et le bureau reprend la valeur. */
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('.m-dest [data-dest]');if(!b)return;
    const sel=document.getElementById('f_destination');
    sel.value=b.dataset.dest;sel.dispatchEvent(new Event('change',{bubbles:true}));
    b.closest('.m-dest').classList.remove('m-invalid');
  });
  new MutationObserver(sync).observe(document.body,{subtree:true,childList:true});
  sync();
})();
</script>

  .chip>button{min-width:44px;min-height:44px}
  /* Compteur des onglets : 11 px au minimum */
  .tab .count{font-size:11px}
  /* Offre : étiquette en bloc, sur deux lignes au besoin */
  .summary-offer{display:block;border-radius:14px;line-height:1.35}
}
