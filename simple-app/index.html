<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hygo</title>
<!-- Barre d’état : couleur du système clair ou sombre (iOS et Android) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f8" id="themeMeta">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e1a">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hygo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Thème : suit le système par défaut, puis le choix de l’utilisateur. Appliqué avant le premier affichage. */
(function(){var t=null;try{t=localStorage.getItem('hygo-theme')}catch(e){}
if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;})();
</script>
<style>
/* ---------- Couleurs : light-dark() suit le mode du système (ou le choix manuel) ---------- */
:root{
  color-scheme:light dark;
  --bg:light-dark(#eef1f8,#0a0e1a);
  --surface:light-dark(#ffffff,#151c33);
  --surface2:light-dark(#f3f5fb,#1d2643);
  --line:light-dark(#dfe4ef,#2a3555);
  --ink:light-dark(#131b33,#eef1fb);
  --muted:light-dark(#67708c,#98a3c6);
  --accent:light-dark(#0b7f77,#43d8c9);
  --accent-ink:light-dark(#ffffff,#03201d);
  --accent-soft:light-dark(#d8f2ee,#15403f);
  --ok:light-dark(#127a3a,#6ee7a0);   --ok-bg:light-dark(#dcf5e4,#153a2a);
  --warn:light-dark(#8a5300,#ffc56b); --warn-bg:light-dark(#fdf0d6,#3b2c12);
  --bad:light-dark(#b42318,#ff8f85);  --bad-bg:light-dark(#fde4e1,#3f1c1a);
  --t1:light-dark(#dcf3ef,#143b3c); --t2:light-dark(#e3eaff,#1c2b57); --t3:light-dark(#fdf0cc,#3b3216);
  --glass:light-dark(rgba(255,255,255,.58),rgba(28,36,66,.55));
  --edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.1));
  --shadow:light-dark(0 1px 2px #1a244a10,0 12px 34px #1a244a1c);
  --r-card:28px; --r-ctl:18px; --r-pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.5,1);
  --sans:-apple-system,BlinkMacSystemFont,"Roboto Flex","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
}
/* Choix manuel dans l’app : force le mode, sinon le système décide. */
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
@media (prefers-reduced-transparency:reduce){:root{--glass:var(--surface)}}
@media (prefers-contrast:more){:root{--line:light-dark(#7d87a3,#7f8bb0);--muted:light-dark(#4a5270,#c3cbe6)}}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);min-height:100vh;overflow-x:hidden;transition:background-color .4s ease,color .4s ease}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(50px);opacity:.9;
  background:radial-gradient(35% 35% at 18% 22%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),
             radial-gradient(32% 32% at 82% 16%,color-mix(in srgb,#8f7cff 20%,transparent),transparent 70%),
             radial-gradient(30% 30% at 60% 88%,color-mix(in srgb,#ff9a62 16%,transparent),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
h1,h2,h3{font-family:var(--sans);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[data-num]{font-variant-numeric:tabular-nums}

/* ---------- Mise en page ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:16px 16px 40px;align-items:start}
.side{position:sticky;top:16px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);border-radius:var(--r-card);box-shadow:inset 0 1px 0 var(--edge),var(--shadow);padding:16px 12px;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 48px)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:13px;flex:none;transition:transform .6s var(--spring)}
.logo img{width:100%;height:100%;display:block;border-radius:inherit}
.brand:hover .logo{transform:rotate(-10deg) scale(1.06)}

.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav::before{content:"";position:absolute;left:0;top:0;width:100%;height:var(--ind-h,0px);border-radius:16px;background:var(--accent-soft);transform:translateY(var(--ind-y,0px));transition:transform .55s var(--spring),height .4s var(--ease),opacity .3s;opacity:var(--ind-on,0)}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:16px;padding:12px 14px;color:var(--muted);background:none;text-align:left;font-weight:500;cursor:pointer;transition:color .3s ease,transform .2s var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button:active{transform:scale(.96)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button svg.i{transition:transform .5s var(--spring)}
.nav button[aria-current="page"] svg.i{transform:translateY(-1px) scale(1.12)}

.rate-card{margin-top:auto;border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--surface2);animation:rise .6s .2s var(--ease) both}
.rate-card small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rate-card p{margin:3px 0;font-size:13px;color:var(--muted)}
.rate-card b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.content{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:6px 0 20px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.6px;margin-top:6px;animation:rise .5s var(--ease) both}
.top p{margin:6px 0 0;color:var(--muted);animation:rise .5s .06s var(--ease) both}
#themeToggle{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge),var(--shadow);transition:transform .3s var(--spring)}
#themeToggle:hover{transform:scale(1.08)}
#themeToggle:active{transform:scale(.9)}
#themeToggle svg.i{width:19px;height:19px;transition:transform .7s var(--spring),opacity .3s}
#themeToggle:hover svg.i{transform:rotate(28deg)}
/* data-eff = thème affiché (fixé par app.js) : lune en clair, soleil en sombre */
#themeToggle[data-eff="dark"] .i-moon{display:none}
#themeToggle[data-eff="light"] .i-sun{display:none}

main#app{display:grid;gap:18px;min-width:0}
main#app>*{animation:rise .55s var(--ease) both}
main#app>*:nth-child(2){animation-delay:.07s}
main#app>*:nth-child(3){animation-delay:.14s}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow);min-width:0;transition:background-color .4s ease,border-color .4s ease}
.card h2{margin:0 0 14px;font-size:17px;font-weight:650}
.grid{display:grid;grid-template-columns:1fr;gap:14px 16px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.field.wide{grid-column:1/-1}
.inp{width:100%;min-height:50px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 14px;font-size:16px;color:var(--ink);background:var(--surface2);min-width:0;transition:border-color .25s,box-shadow .25s,background-color .25s,transform .25s var(--ease)}
.inp:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--surface)}
.inp.is-bad{border-color:var(--bad)}
.inp.is-ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
textarea.inp{min-height:0;resize:vertical}
.search{margin-bottom:16px}
.hint{font-size:12px;color:var(--muted);min-height:17px;margin-top:-2px}
.hint.bad{color:var(--bad)}
.hint.ok{color:var(--ok)}
.input-wrap{position:relative}
.input-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.input-wrap .inp{padding-right:64px}

/* Quantité : boutons + et − */
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface2);min-height:50px;padding:4px}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s var(--spring)}
.stepper button:active{transform:scale(.88)}
.stepper output{font-weight:700;font-size:18px;font-family:var(--mono)}

/* Marge : pastilles rapides */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-btn{border-radius:var(--r-pill);padding:9px 16px;border:1px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer;transition:transform .25s var(--spring),background-color .25s,color .25s,border-color .25s}
.chip-btn:hover{transform:translateY(-1px)}
.chip-btn:active{transform:scale(.94)}
.chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.mini{width:92px;min-height:42px;border-radius:var(--r-pill);text-align:center}

/* Validation automatique : pastilles d’état */
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--ok-bg);color:var(--ok);animation:pop .5s var(--spring) both}
.chk.warn{background:var(--warn-bg);color:var(--warn)}
.chk.bad{background:var(--bad-bg);color:var(--bad)}
.chk b{font-weight:800}
.chk-title{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.pulse{animation:pop .5s var(--spring)}

.btn{min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-ctl);padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .25s var(--spring),box-shadow .25s var(--ease),background-color .25s,border-color .25s,filter .25s,opacity .25s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.icon{min-height:40px;width:40px;padding:0;border-radius:50%}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;min-height:44px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

details.adv{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--accent);font-size:22px;line-height:1;transition:transform .35s var(--spring)}
details[open]>summary::before{transform:rotate(90deg)}
details summary small{font-weight:400;color:var(--muted);margin-left:6px}
details[open]>summary{margin-bottom:12px}
details[open]>.grid{animation:rise .4s var(--ease) both}

/* ---------- Résultat : carte de couverture ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-card);padding:22px 22px 24px;color:#fff;min-height:196px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.42),transparent 42%),radial-gradient(circle at 10% 100%,rgba(255,255,255,.22),transparent 45%),var(--cover,linear-gradient(135deg,#0b7f77,#3b5bdb));text-shadow:0 1px 14px rgba(0,0,0,.2);box-shadow:0 20px 44px -18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);animation:heroIn .7s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.2));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:600}
.hero-name{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.15;text-wrap:balance}
.hero-price{display:grid;gap:2px}
.hero-price small{font-size:12px;opacity:.9}
.hero-price b{font-family:var(--mono);font-size:36px;font-weight:500;letter-spacing:-1px;line-height:1.05}
.res-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-pill);padding:5px 12px}
.res-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#7CFFB2;animation:ping 2s infinite}
.res-tag.manual::before{background:#fff;animation:none}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpis>.kpi:last-child{grid-column:1/-1}}
.kpi{border-radius:22px;padding:15px 16px;display:grid;gap:3px;min-width:0;border:1px solid var(--line);background:var(--surface2);transition:transform .35s var(--spring),box-shadow .3s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.kpi.t1{background:var(--t1);border-color:transparent}
.kpi.t2{background:var(--t2);border-color:transparent}
.kpi>span{font-size:12.5px;color:var(--muted)}
.kpi b{font-size:19px;font-weight:700;letter-spacing:-.3px;font-family:var(--mono);overflow-wrap:anywhere}
.kpi.text b{font-family:var(--sans);font-size:16px;letter-spacing:-.2px}
.kpi small{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.warn-box{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-ctl);padding:11px 14px;font-size:13.5px;margin:14px 0 0}
.bump .kpi{animation:pop .6s var(--spring)}
.bump .kpi:nth-child(2){animation-delay:.05s}
.bump .kpi:nth-child(3){animation-delay:.1s}

/* ---------- Feuille de comparaison ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(6,10,22,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s ease both}
.panel{position:relative;width:min(560px,100%);max-height:84vh;overflow:auto;background:var(--glass);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);border:1px solid var(--edge);border-radius:32px 32px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:inset 0 1px 0 var(--edge),0 -20px 60px rgba(0,0,0,.25);animation:sheetUp .6s var(--spring) both}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h3{font-size:20px;font-weight:700}
.panel>p{margin:6px 0 4px;color:var(--muted);font-size:13px}
.offers{display:grid;gap:10px;margin-top:12px}
.offer{display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:14px 16px;cursor:pointer;min-height:58px;transition:transform .3s var(--spring),box-shadow .3s,border-color .3s,background-color .3s;animation:rise .45s var(--ease) both}
.offer:nth-child(2){animation-delay:.03s}.offer:nth-child(3){animation-delay:.06s}.offer:nth-child(4){animation-delay:.09s}.offer:nth-child(n+5){animation-delay:.12s}
.offer:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.offer:active{transform:scale(.98)}
.offer.is-on{border-color:var(--accent);background:var(--accent-soft)}
.offer .body{display:grid;gap:3px;min-width:0;flex:1}
.offer small{color:var(--muted);font-size:12.5px}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background-color .3s,border-color .3s,transform .4s var(--spring)}
.radio::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);transition:transform .4s var(--spring)}
.offer.is-on .radio{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.offer.is-on .radio::after{transform:rotate(-45deg) scale(1)}

/* ---------- Historique et tarifs ---------- */
#hlist{display:grid;gap:12px}
.hcard{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--surface);box-shadow:var(--shadow);transition:transform .35s var(--spring);animation:rise .5s var(--ease) both}
.hcard:hover{transform:translateY(-3px)}
.thumb{width:64px;height:64px;border-radius:20px;background:var(--cover,linear-gradient(135deg,#0b7f77,#3b5bdb));display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;text-shadow:0 1px 8px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.hbody{display:grid;gap:6px;min-width:0;align-content:start}
.hhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.hhead b{font-size:15.5px}
.hnums{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hnums b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.hcard .actions{margin-top:4px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line>span:first-child{display:grid;min-width:0}
.line small,.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 8px;margin:0}

/* ---------- Validation : pastille qui se dessine + confettis ---------- */
.burst{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center}
.burst-core{position:relative;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--edge);border-radius:32px;padding:26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.3);display:grid;justify-items:center;gap:10px;animation:burstIn .6s var(--spring) both}
.burst-core svg{width:66px;height:66px;fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.burst-core circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s .05s var(--ease) forwards}
.burst-core path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s .6s var(--ease) forwards}
.burst-core p{margin:0;font-weight:700;font-size:17px}
.burst-core small{color:var(--muted)}
.burst i{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:3px;background:var(--c);animation:fly .95s var(--ease) var(--delay,0s) both}
.burst i:nth-of-type(3n){width:6px;height:14px;border-radius:99px}
.burst.out{animation:fade .35s ease forwards}

/* ---------- Notifications ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);z-index:70;max-width:90vw;font-size:14px;box-shadow:var(--shadow);animation:toastIn .45s var(--spring) both}
.toast.is-error{background:var(--bad);color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;border-radius:var(--r-ctl)}
.toast-close{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:2px 10px;cursor:pointer;font:inherit}

/* ---------- Animations ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:.3;transform:scale(.92)}55%{opacity:1;transform:scale(1.04)}100%{transform:none}}
@keyframes heroIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.06)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,255,178,.7)}70%,100%{box-shadow:0 0 0 8px rgba(124,255,178,0)}}
@keyframes burstIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fly{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.6)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:var(--ease)}

/* Formes « continues » façon iOS quand le navigateur les supporte */
@supports (corner-shape:squircle){.card,.hero,.kpi,.hcard,.side,.panel,.offer{corner-shape:squircle}}

/* ---------- Téléphone : barre flottante en verre ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding:14px 14px 130px}
  .side{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));top:auto;min-height:0;border-radius:30px;padding:6px;flex-direction:row;gap:0;z-index:10;box-shadow:inset 0 1px 0 var(--edge),0 16px 40px -10px rgba(10,20,50,.35)}
  .brand,.rate-card{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nav::before{width:var(--ind-w,0px);height:100%;transform:translateX(var(--ind-x,0px));border-radius:24px}
  .nav button{flex-direction:column;justify-content:center;gap:4px;font-size:11.5px;min-height:58px;padding:6px 2px;text-align:center;border-radius:24px}
  .top{margin:8px 2px 18px}
  .top h1{font-size:34px}
  .toast{bottom:112px}
}
@media (max-width:520px){.top h1{font-size:30px}.hero-price b{font-size:31px}}

/* ---------- Mouvement réduit ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="brand"><span class="logo" aria-hidden="true"><img src="icon-192.png" alt=""></span><div><b>Hygo</b><small>Chine → Madagascar</small></div></div>
    <nav class="nav" id="nav">
      <button type="button" data-go="devis"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Devis</span></button>
      <button type="button" data-go="histo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Historique</span></button>
      <button type="button" data-go="tarifs"><svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Tarifs</span></button>
      <button type="button" data-go="reglages"><svg class="i" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Réglages</span></button>
    </nav>
    <div class="rate-card" id="rates"></div>
  </aside>

  <div class="content">
    <header class="top">
      <div>
        <div class="kicker">Chine → Madagascar</div>
        <h1 id="pageTitle">Devis d’importation</h1>
        <p id="pageSub">Renseignez votre produit. Comparez le transport. Fixez votre prix.</p>
      </div>
      <button type="button" id="themeToggle" aria-label="Changer le thème" title="Changer le thème">
        <svg class="i i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <main id="app"></main>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <header class="sheet-head"><h3 id="sheetTitle">Comparer les offres</h3><button type="button" class="btn icon" data-close aria-label="Fermer">✕</button></header>
    <p>Triées par prix de revient. Choisir une offre la fixe pour ce produit.</p>
    <div class="offers" id="sheetBody"></div>
  </section>
</div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
