<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Hygo</title>
<!-- Barre d’état : couleur du thème clair ou sombre du système -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11111B">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hygo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Apparence : « système » par défaut ; clair ou sombre si l’utilisateur l’a choisi. Appliqué avant le premier affichage. */
(function(){var t=null;try{t=localStorage.getItem('hygo-theme')}catch(e){}
if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;})();
</script>
<style>
/* =====================================================================
   Design system « Midnight Finance »
   Tous les styles passent par ces tokens. light-dark() suit le thème
   du système, ou le choix manuel (html[data-theme]).
   ===================================================================== */
:root{
  color-scheme:light dark;
  /* Couleurs */
  --bg:light-dark(#F6F5FA,#11111B);
  --surface:light-dark(#FFFFFF,#1A1A28);
  --elevated:light-dark(#F1EFF8,#252438);
  --ink:light-dark(#191827,#F7F5FF);
  --muted:light-dark(#68677A,#B6B2C8);
  --divider:light-dark(#E8E6EF,#343244);
  --accent:light-dark(#6C5CE7,#8B7CFF);
  --accent-pressed:#5847D6;
  --accent-ink:#FFFFFF;
  --accent-soft:light-dark(#EEEBFD,#2A2550);
  --lavender:#B7A6FF;
  --positive:#34C98B;
  --negative:#FF737D;
  --warning:#F4B740;
  /* Variantes lisibles des couleurs d’état sur fond clair */
  --positive-ink:light-dark(#1A8A5C,#5FDCA7);
  --negative-ink:light-dark(#D6404D,#FF8C94);
  --warning-ink:light-dark(#9A6A00,#F7C866);
  --positive-bg:light-dark(#E3F7EE,#173A2C);
  --negative-bg:light-dark(#FFE9EB,#3E2028);
  --warning-bg:light-dark(#FDF3DC,#3A3020);
  /* Matériau Liquid Glass (navigation, feuilles, contrôles flottants uniquement) */
  --glass:light-dark(rgba(255,255,255,.66),rgba(37,36,56,.62));
  --glass-edge:light-dark(rgba(255,255,255,.85),rgba(255,255,255,.10));
  --glass-blur:blur(24px) saturate(170%);
  --glass-shadow:light-dark(0 8px 28px rgba(25,24,39,.12),0 8px 28px rgba(0,0,0,.45));
  /* Typographie */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;
  --fs-amount:2.2rem; --fs-title:1.85rem; --fs-section:1.15rem; --fs-card-amount:1.35rem;
  --fs-body:1rem; --fs-meta:.82rem; --fs-button:1rem;
  /* Espacements (grille de 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  /* Formes */
  --r-card:22px; --r-btn:16px; --r-field:14px; --r-pill:999px;
  --control:52px;
  /* Mouvement */
  --t-fast:150ms; --t:220ms; --t-slow:300ms; --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
/* Taille de texte dynamique d’iOS (réglage Taille du texte) */
@supports (font:-apple-system-body){html{font:-apple-system-body}}
/* Réduction de transparence : surfaces pleines */
@media (prefers-reduced-transparency:reduce){:root{--glass:var(--surface);--glass-blur:none}}
@media (prefers-contrast:more){:root{--divider:light-dark(#9C99AE,#6E6A88);--muted:light-dark(#4A495C,#D5D1E6);--glass:var(--surface)}}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;accent-color:var(--accent);scroll-padding-bottom:140px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.amount,[data-num]{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Structure ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:var(--s6);max-width:1180px;margin:0 auto;padding:var(--s5) var(--s6) var(--s8)}
.side{position:sticky;top:var(--s5);align-self:start;background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s5);min-height:calc(100vh - 40px)}
.brand{display:flex;gap:var(--s3);align-items:center;padding:0 var(--s2)}
.brand b{font-size:1.05rem;font-weight:600}
.brand small{display:block;font-size:var(--fs-meta);color:var(--muted)}
.logo{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;display:block}

.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav::before{content:"";position:absolute;left:0;top:0;width:100%;height:var(--ind-h,0px);border-radius:14px;background:var(--accent-soft);transform:translateY(var(--ind-y,0px));transition:transform var(--t-slow) var(--ease),height var(--t) var(--ease);opacity:var(--ind-on,0)}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:var(--s3);width:100%;min-height:48px;border:0;border-radius:14px;padding:var(--s2) var(--s3);color:var(--muted);background:none;text-align:left;font-weight:500;cursor:pointer;transition:color var(--t) var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}

.rate-card{margin-top:auto;border-top:1px solid var(--divider);padding:var(--s4) var(--s2) 0}
.rate-card small{display:block;font-size:var(--fs-meta);color:var(--muted);margin-bottom:var(--s1)}
.rate-card p{margin:2px 0;font-size:.9rem;color:var(--muted)}
.rate-card b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.content{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin:var(--s2) 0 var(--s6)}
.top h1{font-size:var(--fs-title);font-weight:700;letter-spacing:-.02em}
.top p{margin:var(--s1) 0 0;color:var(--muted)}
/* Contrôle flottant : verre */
.glass-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--glass-shadow);transition:transform var(--t-fast) var(--ease)}
.glass-btn:active{transform:scale(.94)}
#themeToggle[data-eff="dark"] .i-moon{display:none}
#themeToggle[data-eff="light"] .i-sun{display:none}

main#app{display:grid;gap:var(--s6);min-width:0}
main#app>*{animation:enter var(--t-slow) var(--ease) both}

/* ---------- Cartes (surfaces pleines, pas de verre) ---------- */
.card{background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:var(--s5);min-width:0}
.card>h2{font-size:var(--fs-section);margin:0 0 var(--s4)}
.section-label{font-size:var(--fs-meta);font-weight:600;color:var(--muted);margin:var(--s5) 0 var(--s2)}

/* ---------- Champs ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:var(--s4)}
@media (min-width:680px){.grid{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:6px;min-width:0}
.field>span:first-child,.field>label{font-size:.9rem;font-weight:500;color:var(--ink)}
.field.wide{grid-column:1/-1}
.inp{width:100%;min-height:var(--control);border:1px solid var(--divider);border-radius:var(--r-field);padding:var(--s3) var(--s4);font-size:1.0625rem;color:var(--ink);background:var(--elevated);min-width:0;transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.inp::placeholder{color:var(--muted);opacity:.8}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.is-bad{border-color:var(--negative)}
textarea.inp{min-height:0;resize:vertical}
.hint{font-size:var(--fs-meta);color:var(--muted);min-height:1.2em}
.hint.bad{color:var(--negative-ink)}
.input-wrap{position:relative;display:block}
.input-wrap .suffix{position:absolute;right:var(--s4);top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-wrap .inp{padding-right:56px}
.search{margin-bottom:var(--s4)}

/* Quantité : − et + */
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--divider);border-radius:var(--r-field);background:var(--elevated);min-height:var(--control);padding:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);color:var(--accent);font-size:1.4rem;font-weight:500;cursor:pointer;transition:transform var(--t-fast) var(--ease)}
.stepper button:active{transform:scale(.92)}
.stepper output{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}

/* Marge : segments */
.segments{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.seg{min-height:44px;border-radius:var(--r-pill);padding:0 var(--s4);border:1px solid var(--divider);background:var(--elevated);font-weight:600;cursor:pointer;transition:background-color var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease)}
.seg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini{width:96px;min-height:44px;border-radius:var(--r-pill);text-align:center;padding:0 var(--s3)}

/* Contrôles automatiques : icône + texte (jamais la couleur seule) */
.checks{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 var(--s3);border-radius:var(--r-pill);font-size:var(--fs-meta);font-weight:600;background:var(--positive-bg);color:var(--positive-ink)}
.chk.warn{background:var(--warning-bg);color:var(--warning-ink)}
.chk.bad{background:var(--negative-bg);color:var(--negative-ink)}

/* ---------- Boutons ---------- */
.btn{min-height:var(--control);border:1px solid var(--divider);background:var(--surface);color:var(--ink);border-radius:var(--r-btn);padding:0 var(--s5);font-size:var(--fs-button);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:background-color var(--t) var(--ease),transform var(--t-fast) var(--ease),opacity var(--t) var(--ease)}
.btn:hover{background:var(--elevated)}
.btn:active{transform:scale(.97)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.42;cursor:pointer;transform:none}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent)}
.btn.primary:active{background:var(--accent-pressed)}
.btn.danger{color:var(--negative-ink)}
.btn.small{min-height:44px;padding:0 var(--s4);font-size:.92rem}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:50%}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);cursor:pointer;min-height:44px;padding:0 var(--s1);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s5);align-items:center}
/* Actions du résultat : principal pleine largeur, les deux autres côte à côte, même hauteur */

/* ---------- Tarifs : transitaires, tarifs et dates ---------- */
.toolbar{display:flex;justify-content:flex-end}
.carrier{display:grid;gap:var(--s3)}
.carrier-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap}
.carrier-head h2{font-size:var(--fs-section)}
.actions.tight{margin-top:0}
.subhead{font-size:var(--fs-meta);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:var(--s2)}
.quick-date{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.quick-date .inp{min-height:44px}
@media (max-width:520px){.quick-date{grid-template-columns:1fr 1fr}.quick-date .btn{grid-column:1/-1}}
.editor{display:grid;gap:var(--s4)}
.editor-body{display:block}
.editor .grid{gap:var(--s3)}
.editor .svc-field[hidden]{display:none}
.chips-field{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chips-field .seg{min-height:40px}
.cat-chips{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.cat-chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px 0 var(--s4);border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.95rem;animation:pop var(--t) var(--spring) both}
.cat-chip button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:1.25rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.cat-chip button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cat-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center}
.cat-add .inp{min-height:44px}
.form-error{color:var(--negative-ink);font-size:.9rem;min-height:1.2em;margin:0}
.editor .actions{margin-top:var(--s2)}
.panel .editor-body .line:first-child{border-top:0}
.carrier .line>span:first-child{flex:1 1 170px;min-width:0}
.carrier .line .actions{margin-top:0;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.carrier .line .btn.small{min-height:38px;padding:0 10px;font-size:.85rem}
.fold{border-top:1px solid var(--divider)}
.fold summary{list-style:none;display:flex;align-items:center;gap:var(--s2);min-height:44px;cursor:pointer;font-size:var(--fs-meta);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease}
.fold[open] summary::after{transform:rotate(-135deg)}
.fold summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.fold .line:first-of-type{border-top:0}

/* Dimensions : trois cases côte à côte */
.dims3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.dim{display:block;min-width:0}

.dim .inp{text-align:center;font-variant-numeric:tabular-nums;font-size:1.1rem}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
.result-actions .wide{grid-column:1/-1}
.result-actions .btn{width:100%;padding:0 var(--s3);font-size:.95rem;text-align:center;line-height:1.2}
.result-actions .btn.primary{min-height:56px;font-size:1.02rem}

details.adv{margin-top:var(--s5);border-top:1px solid var(--divider);padding-top:var(--s3)}
details summary{cursor:pointer;font-weight:600;min-height:48px;display:flex;align-items:center;justify-content:space-between;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-right:6px;transition:transform var(--t) var(--ease)}
details[open]>summary::after{transform:rotate(-135deg)}
details summary small{font-weight:400;color:var(--muted);margin-left:var(--s2);margin-right:auto}
details[open]>.grid{margin-top:var(--s3)}

/* ---------- Résultat du devis ---------- */
.summary-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 var(--s3);border-radius:var(--r-pill);font-size:var(--fs-meta);font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.neutral{background:var(--elevated);color:var(--muted)}
.product-name{font-size:var(--fs-section);font-weight:600;margin-top:var(--s3)}
.big-label{font-size:var(--fs-meta);color:var(--muted);margin-top:var(--s4)}
.big-amount{font-size:var(--fs-amount);font-weight:700;line-height:1.1;margin-top:2px}
.sub-amounts{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s2);font-size:.92rem;color:var(--muted)}
.pos{color:var(--positive-ink);font-weight:600}
.neg{color:var(--negative-ink);font-weight:600}
/* Liste groupée façon iOS */
.rows{margin-top:var(--s5);border:1px solid var(--divider);border-radius:var(--r-field);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);min-height:56px;padding:var(--s3) var(--s4);background:var(--elevated)}
.row+.row{border-top:1px solid var(--divider)}
.row>span:first-child{color:var(--muted);font-size:.95rem}
.row .val{text-align:right;font-weight:600}
.row .val small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-meta)}
.note{font-size:var(--fs-meta);color:var(--muted);margin:var(--s3) 0 0}
.warn-box{display:flex;gap:var(--s2);background:var(--warning-bg);color:var(--warning-ink);border-radius:var(--r-field);padding:var(--s3) var(--s4);font-size:.95rem;margin:var(--s4) 0 0}
.updated{animation:fadeNum var(--t-slow) var(--ease)}

/* ---------- Feuille (verre) ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}

/* ---------- Connexion ---------- */
.shell[hidden],.auth[hidden]{display:none}
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:var(--s5)}
.auth-box{width:min(400px,100%);display:grid;gap:var(--s4)}
.auth-box h2{margin:0;font-size:var(--fs-section)}
.auth-box>p{margin:0;color:var(--muted)}
.auth-form{display:grid;gap:var(--s4)}
.auth-links{margin:0;text-align:center;font-size:.92rem;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.scrim{position:absolute;inset:0;background:rgba(10,9,20,.38);animation:fade var(--t) ease both}
.panel{position:relative;width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);border-bottom:0;border-radius:28px 28px 0 0;padding:var(--s2) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom,0px));box-shadow:var(--glass-shadow);animation:sheetUp var(--t-slow) var(--ease) both}
@media (min-width:861px){.sheet{align-items:center}.panel{border-radius:28px;border-bottom:1px solid var(--glass-edge)}}
.grab{width:36px;height:5px;border-radius:99px;background:var(--divider);margin:0 auto var(--s3)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.sheet-head h3{font-size:var(--fs-section)}
.panel>p{margin:var(--s1) 0 var(--s3);color:var(--muted);font-size:.92rem}
.offers{display:grid;gap:var(--s2)}
.offer{display:flex;align-items:center;gap:var(--s3);text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-field);padding:var(--s3) var(--s4);cursor:pointer;min-height:64px;transition:border-color var(--t) var(--ease),background-color var(--t) var(--ease)}
.offer:active{background:var(--elevated)}
.offer.is-on{border-color:var(--accent)}
.offer .body{display:grid;gap:2px;min-width:0;flex:1}
.offer small{color:var(--muted);font-size:var(--fs-meta)}
.offer .price{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.offer .price small{display:block;font-weight:400}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--divider);flex:none;display:grid;place-items:center;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease)}
.radio::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);transition:transform var(--t) var(--ease)}
.offer.is-on .radio{background:var(--accent);border-color:var(--accent)}
.offer.is-on .radio::after{transform:rotate(-45deg) scale(1)}

/* ---------- Historique : liste groupée par date ---------- */
.day{font-size:var(--fs-meta);font-weight:600;color:var(--muted);margin:var(--s5) var(--s1) var(--s2);text-transform:capitalize}
.day:first-child{margin-top:0}
.list{border:1px solid var(--divider);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:68px;padding:var(--s3) var(--s4);background:none;border:0;text-align:left;cursor:pointer;color:var(--ink);transition:background-color var(--t-fast) var(--ease)}
.item:active,.item:hover{background:var(--elevated)}
.item-wrap+.item-wrap{border-top:1px solid var(--divider)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.item .main{min-width:0}
.item .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .main small{display:block;color:var(--muted);font-size:var(--fs-meta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .trail{text-align:right;font-variant-numeric:tabular-nums}
.item .trail b{display:block;font-weight:600}
.item .trail small{display:block;color:var(--muted);font-size:var(--fs-meta)}
.item-actions{display:flex;gap:var(--s2);padding:0 var(--s4) var(--s3) calc(var(--s4) + 44px + var(--s3))}
.line{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;flex-wrap:wrap;padding:var(--s3) 0;border-top:1px solid var(--divider)}
.line:first-of-type{border-top:0}
.line>span:first-child{display:grid;min-width:0}
.line small,.muted{color:var(--muted);font-size:var(--fs-meta)}
.empty{color:var(--muted);text-align:center;padding:var(--s8) var(--s4);margin:0}

/* ---------- Validation : coche dessinée, discrète ---------- */
.done{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center}
.done-core{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);border-radius:24px;padding:var(--s5) var(--s6);box-shadow:var(--glass-shadow);display:grid;justify-items:center;gap:var(--s2);animation:doneIn var(--t-slow) var(--ease) both}
.done-core svg{width:52px;height:52px;fill:none;stroke:var(--positive);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done-core circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 300ms var(--ease) forwards}
.done-core path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 220ms 260ms var(--ease) forwards}
.done-core p{margin:0;font-weight:600}
.done.out{animation:fadeOut var(--t) ease forwards}

/* ---------- Notifications ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);color:var(--ink);padding:var(--s3) var(--s5);border-radius:var(--r-btn);z-index:70;max-width:min(92vw,520px);box-shadow:var(--glass-shadow);animation:toastIn var(--t) var(--ease) both}
.toast.is-error{background:var(--negative-bg);color:var(--negative-ink);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;justify-content:center}
.toast-close{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:36px;padding:0 var(--s3);cursor:pointer;font:inherit}

/* ---------- Mouvements : courts et discrets ---------- */
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeNum{from{opacity:.4}to{opacity:1}}
@keyframes doneIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:220ms;animation-timing-function:var(--ease)}

/* ---------- Téléphone : barre d’onglets flottante en verre ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding:var(--s3) var(--s5) calc(120px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px));top:auto;min-height:0;border-radius:30px;padding:6px;flex-direction:row;gap:0;z-index:10;
    background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
    transition:transform var(--t-slow) var(--ease),padding var(--t) var(--ease)}
  .brand,.rate-card{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nav::before{width:var(--ind-w,0px);height:100%;transform:translateX(var(--ind-x,0px));border-radius:24px}
  .nav button{flex-direction:column;justify-content:center;gap:2px;font-size:.72rem;min-height:56px;padding:var(--s1) 2px;text-align:center;border-radius:24px}
  /* Défilement vers le bas : barre compactée (libellés masqués) */
  .side.compact{padding:3px}
  .side.compact .nav button{min-height:44px}
  .side.compact .nav button span{display:none}
  .top{margin:var(--s2) 0 var(--s5)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){:root{--fs-amount:1.95rem;--fs-title:1.6rem}}

/* ---------- Clavier à l’écran (téléphone) ----------
   Pendant la saisie, la barre d’onglets disparaît pour libérer la place et éviter qu’elle
   chevauche le clavier. La page reste défilable au-dessus du clavier (--kb, mesuré par app.js). */
@media (max-width:860px){
  body.kbd-open .side{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none;transition:transform var(--t) var(--ease),opacity var(--t) var(--ease)}
  body.kbd-open .shell{padding-bottom:calc(var(--kb,0px) + var(--s6))}
  .side{transition:transform var(--t) var(--ease),opacity var(--t) var(--ease)}
}
/* Les champs ne doivent jamais être couverts par la barre du bas quand elle est visible. */
html{scroll-padding-bottom:calc(var(--kb,0px) + 130px)}

/* ---------- Animations : entrées échelonnées, retours au toucher, ressort ---------- */
:root{--spring:cubic-bezier(.34,1.3,.64,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(32px);opacity:0}}
/* Listes : chaque ligne arrive avec un léger décalage */
.rows>*,.offers>*,.list>*{animation:enter var(--t-slow) var(--ease) both}
.rows>*:nth-child(2),.offers>*:nth-child(2),.list>*:nth-child(2){animation-delay:40ms}
.rows>*:nth-child(3),.offers>*:nth-child(3),.list>*:nth-child(3){animation-delay:80ms}
.rows>*:nth-child(4),.offers>*:nth-child(4),.list>*:nth-child(4){animation-delay:120ms}
.rows>*:nth-child(5),.offers>*:nth-child(5),.list>*:nth-child(5){animation-delay:160ms}
.rows>*:nth-child(n+6),.offers>*:nth-child(n+6),.list>*:nth-child(n+6){animation-delay:200ms}
/* Dépliage : le contenu se glisse en place à l’ouverture */
.fold[open]>:not(summary),details.adv[open]>.grid{animation:enter var(--t) var(--ease) both}
/* Retours au toucher */
.seg,.offer,.item,.stepper button,.glass-btn,.nav button{transition:transform var(--t-fast) var(--ease),background-color var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease)}
.seg:active,.offer:active,.glass-btn:active,.nav button:active{transform:scale(.94)}
.item:active{background:var(--elevated)}
/* Onglet actif : icône qui rebondit légèrement */
.nav button[aria-current="page"] .i{animation:pop var(--t-slow) var(--spring) both}
.nav button .i{transition:transform var(--t) var(--spring)}
/* Ressort pour l’indicateur de l’onglet actif */
.nav::before{transition:transform var(--t-slow) var(--spring),height var(--t) var(--ease)}
/* Feuille : fermeture animée (voir closeSheet dans app.js) */
.sheet.closing .scrim{animation:fadeOut var(--t) ease forwards}
.sheet.closing .panel{animation:sheetDown var(--t) var(--ease) forwards}
/* Montant du résultat : léger rebond quand il change */
.big-amount.updated{animation:pop var(--t-slow) var(--spring) both}

/* ---------- Mouvement réduit ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
